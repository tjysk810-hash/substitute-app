<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>①-B · どちらに代入？</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%230d766e'/%3E%3Ctext x='20' y='29' text-anchor='middle' font-size='30' fill='white'%3Ex%3C/text%3E%3C/svg%3E">
<style>
:root{color-scheme:light;--ink:#172a42;--sub:#516278;--teal:#08766b;--soft:#e6f5f1;--line:#dce4ec}*{box-sizing:border-box}body{margin:0;background:#f0f4f8;color:var(--ink);font:16px/1.7 -apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}button,input,select{font:inherit}button,select{cursor:pointer}button{min-height:48px;border:1px solid var(--line);border-radius:12px;background:white;color:var(--ink);padding:10px 18px;font-weight:600}button:hover:not(:disabled){border-color:var(--teal);background:var(--soft)}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #167de0;outline-offset:4px}button:disabled{cursor:default;opacity:.65}.primary{background:var(--teal);border-color:var(--teal);color:white}.primary:hover:not(:disabled){background:#075e55;color:white}.quiet{background:transparent;font-size:14px;font-weight:500}main{max-width:860px;margin:auto;padding:32px 24px 64px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}.brand{font-weight:750;letter-spacing:.03em;font-size:22px}.small{font-size:14px;color:var(--sub)}.settings{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:20px}label{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--sub)}select{min-height:44px;max-width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:white;color:var(--ink)}.paper{background:white;border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 14px 36px #172a4208}.problem{padding:26px 36px;background:#172a42;color:white}.eyebrow{font-size:14px;color:#c6d6e8}.problem h1{font-size:clamp(23px,4.7vw,32px);font-weight:600;margin:10px 0 0;line-height:1.7}.math{font-family:"Avenir Next",-apple-system,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.04em}.x{color:#096e65;background:#e5f5ef;border-radius:6px;padding:0 7px;border-bottom:3px solid #0b8e7e}.problem .x{color:#a3f2da;background:#274758;border-color:#a3f2da}.workspace{padding:28px 36px 32px}.steps{display:flex;gap:8px;list-style:none;padding:0;margin:0 0 26px}.steps li{flex:1;border-top:4px solid #e8edf2;padding-top:8px;color:var(--sub);font-size:13px}.steps li.active{border-color:var(--teal);color:var(--teal);font-weight:700}.steps li.done{border-color:#74bbac}.prompt{font-size:21px;line-height:1.5;margin:0 0 10px}.explain{color:var(--sub);margin:0 0 20px}.equation{font-size:clamp(28px,5.7vw,42px);line-height:1.8;text-align:center;background:#f5f8fb;border-radius:16px;padding:22px 8px;margin:18px 0 24px;overflow-wrap:anywhere}.slot{display:inline-block;min-width:1.6em;line-height:1.3;border:2px dashed var(--teal);color:var(--teal);background:var(--soft);border-radius:7px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.choice{font-size:26px;min-height:66px;font-weight:500}.choice.correct{background:var(--soft);border:2px solid var(--teal)}.choice.wrong{border-color:#b97423;background:#fff5e7}.feedback{margin-top:18px;padding:14px 16px;border-radius:10px;background:#f1f5f9;min-height:56px}.feedback.good{background:var(--soft);color:#07594f}.feedback.retry{background:#fff5e7;color:#7c4e0a}.actions{display:flex;justify-content:space-between;gap:12px;margin-top:18px;flex-wrap:wrap}.actions button{flex-grow:1}.entry{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.entry input{width:160px;min-width:0;padding:10px;text-align:center;font-size:26px;border:2px solid var(--line);border-radius:12px}details{margin-top:22px;border-top:1px solid var(--line);padding-top:16px}summary{cursor:pointer;color:var(--sub);font-size:14px;min-height:40px}ol.history{padding-left:28px;margin:8px 0}.history li{padding:5px;font-size:20px}.result{background:var(--soft);padding:24px;border-radius:16px}.result h2{margin:0 0 8px}.result .math{font-size:30px}.note{margin-top:20px;font-size:14px;color:var(--sub)}.recap{width:100%;border-collapse:collapse;font-size:14px}.recap th,.recap td{text-align:left;padding:10px 4px;border-bottom:1px solid var(--line)}[hidden]{display:none!important}@media(max-width:540px){main{padding:20px 12px 40px}header{align-items:start}.brand{font-size:20px}.problem{padding:20px}.workspace{padding:22px 18px}.settings{gap:10px}.settings label{flex-wrap:wrap;gap:4px;flex:1;min-width:140px}.settings select{width:100%}.steps li{font-size:12px}.prompt{font-size:19px}.equation{padding:20px 4px}.small{font-size:13px}}@media(prefers-reduced-motion:no-preference){.choice{transition:background .15s}}

.settings select{width:100%;min-width:0}.settings label{flex:1 1 260px;flex-direction:column;align-items:stretch}.settings>button{flex:1 1 100%}.equation{letter-spacing:0; font-size:clamp(23px,4.8vw,36px)}.choice{overflow-wrap:anywhere}.steps{flex-wrap:wrap}.steps li{min-width:48px}.checkline{font-size:20px;overflow-wrap:anywhere}.steps li.active{font-weight:700}
</style>
</head><body><main>
<header><div class="brand">どちらに代入？ <span class="small">①-B</span></div><div class="small">わかっている文字から<br>ひとつずつ。</div></header>
<div class="settings"><label>レベル<select id="level"><option value="1">１ · yを入れてxを求める</option><option value="2">２ · x・yをランダムに</option><option value="3">３ · いろいろな式の形</option></select></label><label>答え方<select id="mode"><option value="choice">選択肢で答える</option><option value="input">数字を自分で入れる</option></select></label><button id="apply-settings" class="primary">この条件で５問を始める</button></div>
<p id="settings-status" class="small" role="status" aria-live="polite"></p><p class="small">始めると１問目に戻り、間違い・ヒントの記録もリセットされます。</p>
<section class="paper" aria-label="代入して文字の値を求める練習"><div class="problem"><div id="counter" class="eyebrow"></div><h1 id="problem"></h1></div><div id="workspace" class="workspace"></div></section>
<details><summary>教える人へ · 今回つまずいた場所</summary><p class="small">この５問での間違い・ヒントの回数。戻って答え直した分も含みます。記録は画面を閉じると消えます。</p><div id="stats"></div><p class="small">レベル２・３は、５問にxを求める問題とyを求める問題が必ず入ります。「左右を入れ替える」では計算せず、同じ等式を見慣れた向きにします。</p></details>
<p class="note">急がなくて大丈夫。正解しても勝手に進みません。</p>
</main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),n=x=>String(x).replace('-','−'),par=x=>x<0?'('+n(x)+')':n(x);
const mark=s=>'<span class="x">'+s+'</span>',blank='<span class="slot">?</span>';
const names=['わかっている文字','入れる場所','数字に置き換える','計算・方程式'];
const levels={'1':'yを入れてxを求める','2':'x・yをランダムに','3':'いろいろな式の形'};
const modes={choice:'選択肢で答える',input:'数字を自分で入れる'};
let activeLevel='1',activeMode='choice',questions=[],qi=0,si=0,steps=[],solved=false,hinted=false,stats=[];
const term=(c,v='')=>({c,v});
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeQuestion(form,a,b,x,y,known){let left,right;if(form==='slope'){y=a*x+b;left=[term(1,'y')];right=[term(a,'x'),term(b)]}else if(form==='sum'){left=[term(a,'x'),term(b,'y')];right=[term(a*x+b*y)]}else if(form==='scaled'){left=[term(b,'y')];right=[term(a,'x'),term(b*y-a*x)]}else if(form==='reverse'){left=[term(a*x+b*y)];right=[term(a,'x'),term(b,'y')]}else{left=[term(a,'x')];right=[term(b,'y'),term(a*x-b*y)]}return {form,left,right,x,y,known,target:known==='x'?'y':'x'}}
function makeSet(level){if(level==='1')return [[2,1,3],[3,2,2],[2,3,4],[4,1,2],[3,4,3]].map(([a,b,x])=>makeQuestion('slope',a,b,x,0,'y'));
const knowns=shuffle(['x','y','x','y',Math.random()<.5?'x':'y']);const forms=level==='2'?Array(5).fill('slope'):shuffle(['sum','scaled','reverse','other','sum']);
return forms.map((f,i)=>{const a=2+Math.floor(Math.random()*3),b=1+Math.floor(Math.random()*3),x=Math.floor(Math.random()*4),y=1+Math.floor(Math.random()*4);return makeQuestion(f,a,b,x,y,knowns[i])})}
function expression(ts,q,sub=false,slot=false){return ts.map((t,i)=>{let value;if(t.v){const variable=t.v===q.known&&sub?(slot?blank:par(q[t.v])):t.v;value=(Math.abs(t.c)===1?'':n(Math.abs(t.c))+(sub&&t.v===q.known?' × ':''))+variable}else value=n(Math.abs(t.c));return(i===0?(t.c<0?'−':''):(t.c<0?' − ':' + '))+value}).join('')}
const eq=(q,sub=false,slot=false)=>expression(q.left,q,sub,slot)+' = '+expression(q.right,q,sub,slot);
function simplified(ts,q){return ts.map(t=>t.v===q.known?term(t.c*q[t.v]):t)}
const totalConst=ts=>ts.filter(t=>!t.v).reduce((a,t)=>a+t.c,0);
const plain=(ts,q)=>expression(ts,q);
function buildSteps(q){const value=q[q.known],out=[];
const add=(cat,title,desc,before,after,answer,hint,options)=>out.push({cat,title,desc,before,after,answer,hint,options});
add(0,'わかっているのは、どちら？',`「${q.known} = ${n(value)}」と問題に書いてあるよ。`,eq(q),eq(q),q.known,'「〜のとき」の直前を見よう。求める文字ではなく、数字がわかっている文字を選ぶ。',['x','y']);
add(1,`数字（${n(value)}）を入れる場所は、どこ？`,`${q.known} = ${n(value)}。どの文字を数字に置き換える？`,eq(q),eq(q),q.known,`${q.known} のところだけに ${n(value)} を入れる。もう一方の文字は、そのまま。`,['x','y','＋','＝']);
add(2,`${q.known} を数字（${n(value)}）に置き換えよう。`,'空いているところに、わかっている数字を入れよう。',eq(q,true,true),eq(q,true),value,`${q.known} = ${n(value)} だから、入れる数字は ${n(value)}。`);
let l=simplified(q.left,q),r=simplified(q.right,q);const knownTerm=[...q.left,...q.right].find(t=>t.v===q.known);
if(Math.abs(knownTerm.c)!==1)add(3,'先に、かけ算をしよう。',`${n(knownTerm.c)} × ${par(value)} は、いくつ？`,eq(q,true),plain(l,q)+' = '+plain(r,q),knownTerm.c*value,'数字に置き換えたところを計算する。文字が残っているところは、そのまま。');
const unknownLeft=l.some(t=>t.v===q.target);
if(!unknownLeft){add(3,'左右を入れ替えてみよう。','「＝」の左右を入れ替えても、同じ等式。符号は変えないよ。',plain(l,q)+' = '+plain(r,q),plain(r,q)+' = '+plain(l,q),null,'左右をそっくり交換するだけ。足したり引いたりする操作ではない。');[l,r]=[r,l]}
const coefficient=l.find(t=>t.v===q.target).c,constant=totalConst(l),rhs=totalConst(r),remaining=rhs-constant;
if(r.length>1)add(3,'数字だけの側を計算しよう。',`${plain(r,q)} は、いくつ？`,plain(l,q)+' = '+plain(r,q),plain(l,q)+' = '+n(rhs),rhs,'かけ算が終わっているので、残りのたし算・ひき算をしよう。');
const unknown=plain([term(coefficient,q.target)],q);
if(l.some(t=>!t.v)){if(constant!==0){const op=constant>0?'引く':'足す',symbol=constant>0?' − ':' + ';add(3,`両辺から${constant>0?'':'ではなく、両辺に'} ${n(Math.abs(constant))} を${op}。`.replace('両辺からではなく、両辺に','両辺に'),`文字の項だけを残したい。右側の ${n(rhs)}${symbol}${n(Math.abs(constant))} は？`,plain(l,q)+symbol+n(Math.abs(constant))+' = '+n(rhs)+symbol+n(Math.abs(constant)),unknown+' = '+n(remaining),remaining,`左側の ${constant>0?'+':'−'} ${n(Math.abs(constant))} をなくすために、両辺に同じ計算をする。`)}else add(3,'０を足す部分を整理しよう。','０を足しても、値は変わらない。右側の数字は、そのまま。',plain(l,q)+' = '+n(rhs),unknown+' = '+n(rhs),rhs,'文字の項と、０だけの項を見分けよう。')}
if(coefficient!==1)add(3,`両辺を ${n(coefficient)} で割ろう。`,`${q.target} に ${n(coefficient)} がかかっている。${n(remaining)} ÷ ${n(coefficient)} は？`,unknown+' ÷ '+n(coefficient)+' = '+n(remaining)+' ÷ '+n(coefficient),q.target+' = '+n(q[q.target]),q[q.target],`両辺を同じ ${n(coefficient)} で割ると、${q.target} だけになる。`);
else add(3,`${q.target} の値を答えよう。`,'求めたかった文字の値は、いくつ？',q.target+' = '+n(remaining),q.target+' = '+n(q[q.target]),q[q.target],`今残っている式を読もう。${q.target} は ${n(remaining)}。`);
return out}
function status(){const pending=$('level').value!==activeLevel||$('mode').value!==activeMode;$('settings-status').textContent=(pending?'変更はまだ反映されていません。上のボタンで始めてください。 ':'')+`現在：レベル${activeLevel} ${levels[activeLevel]} ／ ${modes[activeMode]}`}
function statView(){$('stats').innerHTML='<table class="recap"><thead><tr><th>手順</th><th>間違い</th><th>ヒント</th></tr></thead><tbody>'+names.map((v,i)=>`<tr><td>${v}</td><td>${stats[i].wrong}回</td><td>${stats[i].hints}回</td></tr>`).join('')+'</tbody></table>'}
function feedback(text,cls=''){$('feedback').textContent=text;$('feedback').className='feedback '+cls}
function options(s){if(s.options)return shuffle(s.options);const values=[s.answer,s.answer+1,s.answer-1,0,s.answer+2];return shuffle([...new Set(values)].slice(0,4))}
function history(){return '<ol class="history math"><li>'+eq(questions[qi])+'</li>'+steps.slice(0,si).filter(s=>s.cat>=2).map(s=>'<li>'+s.after+'</li>').join('')+'</ol>'}
function render(){const q=questions[qi];statView();$('counter').textContent=`①-B · レベル${activeLevel} · ${qi+1} / 5 問目`;$('problem').innerHTML=`<span class="math">${eq(q)}</span><br><span class="math">${q.known} = ${n(q[q.known])}</span> のとき、${q.target} は？`;
if(si===steps.length){complete();return}const s=steps[si];$('workspace').innerHTML=`<ol class="steps">${['わかる文字','場所','置き換え','計算'].map((t,i)=>`<li class="${i===s.cat?'active':i<s.cat?'done':''}" ${i===s.cat?'aria-current="step"':''}>${i+1} ${t}</li>`).join('')}</ol><h2 class="prompt">${s.title}</h2><p class="explain">${s.desc}</p><div id="equation" class="equation math" aria-live="polite">${s.before}</div><div id="answerArea"></div><div id="feedback" class="feedback" role="status" aria-live="polite">${s.answer===null?'ボタンを押して、式の向きを変えてみよう。':'１つ答えたら、次の手順へ。'}</div><div class="actions"><button id="back" ${si===0?'disabled':''}>１つ前の手順に戻る</button><button id="hint" class="quiet">ヒントを見る</button><button id="next" class="primary" hidden>次の手順へ</button></div>${si>2?'<details><summary>ここまでの途中式</summary>'+history()+'</details>':''}`;
if(s.answer===null){$('answerArea').innerHTML='<button id="flip" class="primary">左右を入れ替える</button>';$('flip').onclick=()=>answer(null)}else if(activeMode==='input'&&typeof s.answer==='number'){$('answerArea').innerHTML='<form id="form" class="entry"><label for="entry">答え</label><input id="entry" type="text" inputmode="text" autocomplete="off" aria-label="答えの数字"><button type="submit" class="primary">たしかめる</button></form>';$('form').onsubmit=e=>{e.preventDefault();const raw=$('entry').value.normalize('NFKC').replace(/−/g,'-').trim();if(!/^-?\d+$/.test(raw)){feedback('数字を入れてね。負の数は「-2」のように書けるよ。','retry');return}answer(Number(raw))}}else{const values=options(s);$('answerArea').innerHTML='<div class="choices">'+values.map((v,i)=>`<button class="choice math" data-choice="${i}">${typeof v==='number'?n(v):s.cat===0?v+' = '+n(q[q.known]):v}</button>`).join('')+'</div>';document.querySelectorAll('[data-choice]').forEach(btn=>btn.onclick=()=>answer(values[Number(btn.dataset.choice)],btn))}
$('back').onclick=back;$('hint').onclick=()=>{if(!hinted){stats[s.cat].hints++;hinted=true;statView()}feedback(s.hint)};$('next').onclick=()=>{if(!solved)return;si++;solved=false;hinted=false;render()}}
function answer(value,button){if(solved)return;const s=steps[si];if(value!==s.answer){stats[s.cat].wrong++;statView();if(button)button.classList.add('wrong');feedback('もう一度見てみよう。'+s.hint,'retry');return}solved=true;if(button)button.classList.add('correct');$('equation').innerHTML=s.after;document.querySelectorAll('#answerArea button,#answerArea input').forEach(el=>el.disabled=true);feedback(s.answer===null?'左右を入れ替えたね。式の意味は同じ。':s.cat===2?'数字が式に入ったね。残った文字の値を求めよう。':s.cat<2?'そう。その文字の値がわかっている。':'その計算でOK。式も更新されたよ。','good');$('hint').hidden=true;$('next').hidden=false;$('next').textContent=si===steps.length-1?'答えを確かめる':'次の手順へ';$('next').focus()}
function back(){if(si===0)return;si--;solved=false;hinted=false;render()}
function checkExpression(ts,q){return ts.map((t,i)=>{const sign=i===0?(t.c<0?'−':''):(t.c<0?' − ':' + ');return sign+(t.v?(Math.abs(t.c)===1?'':Math.abs(t.c)+' × ')+par(q[t.v]):Math.abs(t.c))}).join('')}
function complete(){const q=questions[qi],total=ts=>ts.reduce((sum,t)=>sum+t.c*(t.v?q[t.v]:1),0);$('workspace').innerHTML=`<div class="result"><h2>${q.target} の値が求められた。</h2><div class="math">${q.target} = ${n(q[q.target])}</div></div><h3>元の式で、答えを確かめよう。</h3><p>${q.known} = ${n(q[q.known])}、${q.target} = ${n(q[q.target])} を入れると…</p><div class="checkline math">左側：${checkExpression(q.left,q)} = ${n(total(q.left))}<br>右側：${checkExpression(q.right,q)} = ${n(total(q.right))}</div><p>左右が同じ数になったね。</p><details><summary>解き方を振り返る</summary>${history()}</details><div class="actions"><button id="back">１つ前の手順に戻る</button><button id="repeat">この問題をもう一度</button><button id="advance" class="primary">${qi===4?'５問の練習を終える':'次の問題へ'}</button></div>`;$('back').onclick=back;$('repeat').onclick=()=>{si=0;solved=false;hinted=false;render()};$('advance').onclick=()=>{if(qi===4){finish();return}qi++;loadQuestion()}}
function loadQuestion(){si=0;solved=false;hinted=false;steps=buildSteps(questions[qi]);render()}
function finish(){$('counter').textContent='①-B · 5 / 5 問 おわり';$('problem').textContent='今日は５問、取り組めた。';$('workspace').innerHTML='<div class="result"><h2>わかっている文字に、数字を入れる。</h2><p>xがわかっていたら、xに。<br>yがわかっていたら、yに。<br>式の形が変わっても、やることは同じ。</p></div><div class="actions"><button id="again">同じ５問をもう一度</button><button id="fresh" class="primary">このレベルでもう５問</button></div>';$('again').onclick=()=>reset(false);$('fresh').onclick=()=>reset(true)}
function reset(fresh){$('level').value=activeLevel;$('mode').value=activeMode;if(fresh)questions=makeSet(activeLevel);qi=0;stats=names.map(()=>({wrong:0,hints:0}));loadQuestion();status()}
function start(){activeLevel=$('level').value;activeMode=$('mode').value;reset(true)}
$('level').onchange=status;$('mode').onchange=status;$('apply-settings').onclick=()=>{start();$('problem').scrollIntoView({block:'start',behavior:'instant'})};start();
})();
</script></body></html>
