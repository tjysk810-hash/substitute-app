<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ひとつずつ、代入。</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%230d766e'/%3E%3Ctext x='20' y='29' text-anchor='middle' font-size='30' fill='white'%3Ex%3C/text%3E%3C/svg%3E">
<style>
:root{color-scheme:light;--ink:#172a42;--sub:#516278;--teal:#08766b;--soft:#e6f5f1;--line:#dce4ec}*{box-sizing:border-box}body{margin:0;background:#f0f4f8;color:var(--ink);font:16px/1.7 -apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}button,input,select{font:inherit}button,select{cursor:pointer}button{min-height:48px;border:1px solid var(--line);border-radius:12px;background:white;color:var(--ink);padding:10px 18px;font-weight:600}button:hover:not(:disabled){border-color:var(--teal);background:var(--soft)}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #167de0;outline-offset:4px}button:disabled{cursor:default;opacity:.65}.primary{background:var(--teal);border-color:var(--teal);color:white}.primary:hover:not(:disabled){background:#075e55;color:white}.quiet{background:transparent;font-size:14px;font-weight:500}main{max-width:860px;margin:auto;padding:32px 24px 64px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}.brand{font-weight:750;letter-spacing:.03em;font-size:22px}.small{font-size:14px;color:var(--sub)}.settings{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:20px}label{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--sub)}select{min-height:44px;max-width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:white;color:var(--ink)}.paper{background:white;border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 14px 36px #172a4208}.problem{padding:26px 36px;background:#172a42;color:white}.eyebrow{font-size:14px;color:#c6d6e8}.problem h1{font-size:clamp(23px,4.7vw,32px);font-weight:600;margin:10px 0 0;line-height:1.7}.math{font-family:"Avenir Next",-apple-system,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.04em}.x{color:#096e65;background:#e5f5ef;border-radius:6px;padding:0 7px;border-bottom:3px solid #0b8e7e}.problem .x{color:#a3f2da;background:#274758;border-color:#a3f2da}.workspace{padding:28px 36px 32px}.steps{display:flex;gap:8px;list-style:none;padding:0;margin:0 0 26px}.steps li{flex:1;border-top:4px solid #e8edf2;padding-top:8px;color:var(--sub);font-size:13px}.steps li.active{border-color:var(--teal);color:var(--teal);font-weight:700}.steps li.done{border-color:#74bbac}.prompt{font-size:21px;line-height:1.5;margin:0 0 10px}.explain{color:var(--sub);margin:0 0 20px}.equation{font-size:clamp(28px,5.7vw,42px);line-height:1.8;text-align:center;background:#f5f8fb;border-radius:16px;padding:22px 8px;margin:18px 0 24px;overflow-wrap:anywhere}.slot{display:inline-block;min-width:1.6em;line-height:1.3;border:2px dashed var(--teal);color:var(--teal);background:var(--soft);border-radius:7px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.choice{font-size:26px;min-height:66px;font-weight:500}.choice.correct{background:var(--soft);border:2px solid var(--teal)}.choice.wrong{border-color:#b97423;background:#fff5e7}.feedback{margin-top:18px;padding:14px 16px;border-radius:10px;background:#f1f5f9;min-height:56px}.feedback.good{background:var(--soft);color:#07594f}.feedback.retry{background:#fff5e7;color:#7c4e0a}.actions{display:flex;justify-content:space-between;gap:12px;margin-top:18px;flex-wrap:wrap}.actions button{flex-grow:1}.entry{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.entry input{width:160px;min-width:0;padding:10px;text-align:center;font-size:26px;border:2px solid var(--line);border-radius:12px}details{margin-top:22px;border-top:1px solid var(--line);padding-top:16px}summary{cursor:pointer;color:var(--sub);font-size:14px;min-height:40px}ol.history{padding-left:28px;margin:8px 0}.history li{padding:5px;font-size:20px}.result{background:var(--soft);padding:24px;border-radius:16px}.result h2{margin:0 0 8px}.result .math{font-size:30px}.note{margin-top:20px;font-size:14px;color:var(--sub)}.recap{width:100%;border-collapse:collapse;font-size:14px}.recap th,.recap td{text-align:left;padding:10px 4px;border-bottom:1px solid var(--line)}[hidden]{display:none!important}@media(max-width:540px){main{padding:20px 12px 40px}header{align-items:start}.brand{font-size:20px}.problem{padding:20px}.workspace{padding:22px 18px}.settings{gap:10px}.settings label{flex-wrap:wrap;gap:4px;flex:1;min-width:140px}.settings select{width:100%}.steps li{font-size:12px}.prompt{font-size:19px}.equation{padding:20px 4px}.small{font-size:13px}}@media(prefers-reduced-motion:no-preference){.choice{transition:background .15s}}
</style>
</head>
<body><main>
<header><div class="brand">ひとつずつ、代入。</div><div class="small">１次関数のまえに<br>まずは、数字を入れる。</div></header>
<div class="settings"><label>問題<select id="level"><option value="basic">① 正の数から</option><option value="zero">② ０も入れてみる</option><option value="negative">③ 負の数にも挑戦</option></select></label><label>答え方<select id="mode"><option value="choice">４択で答える</option><option value="input">数字を自分で入れる</option></select></label><button id="apply-settings" class="primary" type="button">この条件で５問を始める</button></div><p id="settings-status" class="small" role="status" aria-live="polite"></p><p class="small">始めると１問目に戻り、間違い・ヒントの記録もリセットされます。</p>
<section class="paper" aria-label="代入の練習"><div class="problem"><div class="eyebrow" id="counter"></div><h1 id="problem"></h1></div><div class="workspace" id="workspace"></div></section>
<details><summary>教える人へ · 今回つまずいた場所</summary><p class="small">間違えた回答と、ヒントを使った回数です。同じ段階での再回答も数えます。「この条件で５問を始める」を押すと、記録をリセットします。</p><div id="stats"></div></details>
<p class="note">急がなくて大丈夫。正解しても勝手に進みません。</p>
</main>
<script>
(()=>{'use strict';
const bank={basic:[[2,1,3],[3,2,2],[2,3,4],[4,1,2],[3,4,3]],zero:[[2,3,0],[3,0,2],[4,1,0],[2,0,0],[5,2,1]],negative:[[2,1,-2],[3,-2,2],[-2,3,2],[2,-3,-1],[-3,-2,-2]]};
const names=['入れる場所','数字に置き換える','かけ算','残りの計算'];
const levelNames={basic:'正の数から',zero:'０も入れてみる',negative:'負の数にも挑戦'},modeNames={choice:'４択で答える',input:'数字を自分で入れる'};
let activeLevel='basic',activeMode='choice';
let questions=bank.basic,qi=0,step=0,solved=false,hinted=false,history=[],stats=names.map(()=>({wrong:0,hints:0}));
const $=id=>document.getElementById(id),num=n=>String(n).replace('-','−'),paren=n=>n<0?'('+num(n)+')':num(n),tail=b=>b<0?' − '+num(-b):' + '+num(b);
const eq=q=>(q[0]===1?'':q[0]===-1?'−':num(q[0]))+'<span class="x">x</span>'+tail(q[1]);
function updateStats(){$('stats').innerHTML='<table class="recap"><thead><tr><th>手順</th><th>間違い</th><th>ヒント</th></tr></thead><tbody>'+names.map((n,i)=>`<tr><td>${n}</td><td>${stats[i].wrong}回</td><td>${stats[i].hints}回</td></tr>`).join('')+'</tbody></table>'}
function content(){const[a,b,x]=questions[qi],p=a*x;return [
{title:`数字（${num(x)}）を入れる場所は、どこ？`,desc:`「x = ${num(x)}」は「x のところに ${num(x)} を入れる」という意味。`,formula:'y = '+eq(questions[qi]),answer:'x',choices:['y',num(a),'x',num(b)],hint:'置き換えるのは x だけ。y や、ほかの数字はそのまま。',ok:'そう。数字に置き換える場所は x。'},
{title:'x を、指定された数字に置き換えよう。',desc:`x = ${num(x)}。空いているところに入る数字は？`,formula:`y = ${num(a)} × <span id="substitution-slot" class="slot" aria-live="polite">?</span>${tail(b)}`,answer:x,choices:[x,a,b,x+1],hint:`x の代わりに ${num(x)} を入れるよ。${num(a)}x は「${num(a)} × x」のこと。`,ok:`x が ${num(x)} に変わったね。${x<0?'負の数は、かっこで囲んでおこう。':''}`},
{title:'先に、かけ算をしよう。',desc:`${num(a)} × ${paren(x)} は、いくつ？`,formula:`y = <span class="x">${num(a)} × ${paren(x)}</span>${tail(b)}`,answer:p,choices:[p,a+x,p+b,p+1],hint:`${num(a)} × ${paren(x)} を先に計算。${b<0?'引く':'足す'} ${num(Math.abs(b))} は、あとで使う。${x===0?'０をかけると答えは０。':a<0&&x<0?'負の数どうしのかけ算は、正の数。':a*x<0?'正の数と負の数のかけ算は、負の数。':''}`,ok:`かけ算の答えは ${num(p)}。残りの ${tail(b).trim()} も忘れずに。`},
{title:b<0?'最後に、ひき算をしよう。':'最後に、たし算をしよう。',desc:`${num(p)}${tail(b)} は、いくつ？`,formula:`y = ${num(p)}${tail(b)}`,answer:p+b,choices:[p+b,p,p-b,p+b+1],hint:`かけ算は終わったよ。${num(p)} から ${num(Math.abs(b))} ${b<0?'小さい':'大きい'}数にしよう。${b===0?'０を足しても、数は変わらない。':''}`,ok:`y = ${num(p+b)}。これが求めたかった答え。`}
][step]}
function choiceValues(c){if(step===0)return ['x','y',num(questions[qi][0]),'＝'];let v=[...new Set(c.choices)];let n=0;while(v.length<4){if(!v.includes(n))v.push(n);n++}return v.slice(0,4).sort(()=>0.5-Math.random())}
function render(){updateStats();$('counter').textContent=`${qi+1} / 5 問目`;$('problem').innerHTML=`<span class="math">y = ${eq(questions[qi])}</span><br><span class="math">x = ${num(questions[qi][2])}</span> のとき、y は？`;
if(step===4){complete();return}const c=content();$('workspace').innerHTML=`<ol class="steps">${['場所','置き換え','かけ算','答え'].map((n,i)=>`<li class="${i===step?'active':i<step?'done':''}" ${i===step?'aria-current="step"':''}>${i+1} ${n}</li>`).join('')}</ol><h2 class="prompt">${c.title}</h2><p class="explain">${c.desc}</p><div class="equation math">${c.formula}</div><div id="answerArea"></div><div id="feedback" class="feedback" role="status" aria-live="polite">${step===0?'x と書いてあるボタンを押そう。':'１つ答えたら、次の手順へ。'}</div><div class="actions"><button id="back" ${step===0?'disabled':''}>１つ前の手順に戻る</button><button id="hint" class="quiet">ヒントを見る</button><button id="next" class="primary" hidden>次の手順へ</button></div>${history.length?`<details><summary>ここまでの途中式</summary><ol class="history math">${history.map(h=>'<li>'+h+'</li>').join('')}</ol></details>`:''}`;
if(activeMode==='input'&&step>0){$('answerArea').innerHTML='<form id="form" class="entry"><label for="entry">答え</label><input id="entry" type="text" inputmode="text" autocomplete="off" aria-label="答えの数字"><button class="primary" type="submit">たしかめる</button></form>';$('form').onsubmit=e=>{e.preventDefault();const raw=$('entry').value.normalize('NFKC').replace(/−/g,'-').trim();if(!/^-?\d+$/.test(raw)){feedback('数字を入れてね。負の数は「-2」のように書けるよ。','retry');return}answer(Number(raw))}}
else{$('answerArea').innerHTML='<div class="choices">'+choiceValues(c).map((v,i)=>`<button class="choice math" data-i="${i}">${typeof v==='number'?num(v):v}</button>`).join('')+'</div>';document.querySelectorAll('.choice').forEach(btn=>btn.onclick=()=>answer(step===0?btn.textContent:Number(btn.textContent.replace('−','-')),btn))}
$('back').onclick=goBack;$('hint').onclick=()=>{if(!hinted){stats[step].hints++;hinted=true;updateStats()}feedback(c.hint,'')};$('next').onclick=()=>{step++;solved=false;hinted=false;render()};}
function goBack(){if(step===0)return;step--;solved=false;hinted=false;history=history.slice(0,Math.max(0,step-1));render()}
function feedback(t,cls){$('feedback').textContent=t;$('feedback').className='feedback '+cls}
function answer(value,btn){if(solved)return;const c=content();if(value!==c.answer){stats[step].wrong++;updateStats();if(btn)btn.classList.add('wrong');feedback(step===0?'今回は x に数字を入れるよ。x を探してみよう。':step===1?`入れるのは「x = ${num(questions[qi][2])}」の ${num(questions[qi][2])}。もう一度選んでみよう。`:'もう一度、色のついた式や計算する数を見てみよう。ヒントも使えるよ。','retry');return}solved=true;if(btn)btn.classList.add('correct');document.querySelectorAll('#answerArea button,#answerArea input').forEach(el=>el.disabled=true);const[a,b,x]=questions[qi];if(step===1){$('substitution-slot').textContent=paren(x);history.push(`y = ${num(a)} × ${paren(x)}${tail(b)}`);}if(step===2)history.push(`y = ${num(a*x)}${tail(b)}`);if(step===3)history.push(`y = ${num(a*x+b)}`);feedback(c.ok,'good');$('hint').hidden=true;$('next').hidden=false;$('next').textContent=step===3?'解き方を振り返る':'次の手順へ';$('next').focus()}
function complete(){const[a,b,x]=questions[qi];$('workspace').innerHTML=`<div class="result"><h2>数字を入れて、y が出せた。</h2><div class="math">x = ${num(x)} のとき、y = ${num(a*x+b)}</div></div><p class="explain" style="margin-top:22px">x を数字に置き換える。それから、かけ算を先にする。</p><ol class="history math"><li>y = ${eq(questions[qi])}</li>${history.map(h=>'<li>'+h+'</li>').join('')}</ol><div class="actions"><button id="back">１つ前の手順に戻る</button><button id="repeat">この問題をもう一度</button><button id="advance" class="primary">${qi===4?'５問の練習を終える':'次の問題へ'}</button></div>`;$('back').onclick=goBack;$('repeat').onclick=()=>{step=0;solved=false;hinted=false;history=[];render()};$('advance').onclick=()=>{if(qi<4){qi++;step=0;solved=false;hinted=false;history=[];render()}else finish()}}
function finish(){$('counter').textContent='5 / 5 問 おわり';$('problem').textContent='今日は５問、取り組めた。';$('workspace').innerHTML='<div class="result"><h2>代入は「文字を数字に置き換える」。</h2><p>① x を見つける<br>② 数字に置き換える<br>③ かけ算をする<br>④ 残りを計算する</p></div><p>次は「数字を自分で入れる」で、同じ手順を試してみよう。</p><div class="actions"><button id="again" class="primary">同じ５問をもう一度</button></div>';$('again').onclick=()=>{$('level').value=activeLevel;$('mode').value=activeMode;start()}}
function settingsStatus(){const pending=$('level').value!==activeLevel||$('mode').value!==activeMode;$('settings-status').textContent=(pending?'変更はまだ反映されていません。「この条件で５問を始める」を押してください。 ':'')+'現在の練習：'+levelNames[activeLevel]+' ／ '+modeNames[activeMode]+(activeMode==='input'?'（最初の「場所」はボタンで選びます）':'')}
function start(){activeLevel=$('level').value;activeMode=$('mode').value;questions=bank[activeLevel];qi=0;step=0;solved=false;hinted=false;history=[];stats=names.map(()=>({wrong:0,hints:0}));render();settingsStatus()}
$('level').onchange=settingsStatus;$('mode').onchange=settingsStatus;$('apply-settings').onclick=()=>{start();$('problem').scrollIntoView({block:'start',behavior:'instant'})};start();
})();
</script></body></html>
