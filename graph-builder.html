r:pointer;min-height:40px;font-size:14px}[hidden]{display:none!important}@media(max-width:750px){.layout{grid-template-columns:1fr}.area{padding:18px}.layout{gap:20px}.board{max-width:450px}}@media(max-width:480px){main{padding:16px 10px 40px}h1{font-size:21px}.settings{grid-template-columns:1fr}.top{padding:18px}.top h2{font-size:23px}.area{padding:14px}.prompt{font-size:19px}.formula{font-size:22px}}
</style></head><body><main><header><h1>２点から、直線へ。 <small>③</small></h1><span class="small">点を打つ。<br>そこから進む。</span></header>
<div class="settings"><label>段階<select id="level"><option value="1">１ · 代入して２点を打つ</option><option value="2">２ · ２点の間の動きを見る</option><option value="3">３ · 切片と傾きでかく</option><option value="4">４ · 指定された点と傾きでかく</option></select></label><label>傾きの種類<select id="kind"><option value="positive">正の整数</option><option value="negative">負の整数</option><option value="zero">０（水平な直線）</option><option value="fraction">分数（正・負）</option></select></label><button id="apply" class="primary">この条件で５問を始める</button></div><p id="status" class="small" role="status" aria-live="polite"></p>
<section class="lesson"><div class="top"><div id="counter" class="small"></div><h2 id="question"></h2><p id="question-note"></p></div><div class="area" id="area"></div></section>
<details><summary>教える人へ · 今回つまずいた場所</summary><p class="small">間違えた回答の回数です。戻って答えた分も数えます。「この条件で５問を始める」でリセット。保存はされません。</p><div id="stats"></div><p class="small">横→縦の途中の曲がり角は、直線に使う点ではありません。直線は出発点と到着点を通ります。分数の傾きでは、分母の数だけ右へ、分子の数だけ上下へ進みます。</p></details><p class="small">正解しても勝手に進みません。盤面を押しにくいときは、下の「横・縦」の数字で選べます。</p>
</main><script>
(()=>{'use strict';
const $=id=>document.getElementById(id),n=v=>String(v).replace('-','−'),par=v=>v<0?'('+n(v)+')':n(v),point=p=>`(${n(p.x)}, ${n(p.y)})`;
const names=['代入・値を読む','最初の点を打つ','横に進む','縦に進む・２点目'],levels={'1':'代入して２点','2':'２点の間の動き','3':'切片と傾き','4':'指定点と傾き'},kinds={positive:'正の整数',negative:'負の整数',zero:'０',fraction:'分数'};
let level='1',kind='positive',questions=[],qi=0,si=0,steps=[],solved=false,selected=null,stats=[0,0,0,0],hinted=false,bridge=false;
let directPoints=null;
const domain=Array.from({length:9},(_,i)=>i-4);
const slope=q=>q.run===1?n(q.rise):`${n(q.rise)}/${q.run}`;
const tail=b=>b===0?'':b<0?' − '+n(-b):' + '+n(b);
function equation(q){const a=q.rise===0?'0x':q.run===1?(q.rise===1?'x':q.rise===-1?'−x':n(q.rise)+'x'):`(${slope(q)})x`;return 'y = '+a+tail(q.b)}
const movement=q=>`右に ${q.run}、${q.rise===0?'上下には動かない':(q.rise>0?'上':'下')+'に '+Math.abs(q.rise)}`;
function buildQuestion(rise,run,b,p=null){p=p||{x:0,y:b};return {rise,run,b,p,q:{x:p.x+run,y:p.y+rise}}}
function makeSet(){const pool=kind==='positive'?[[2,1],[1,1]]:kind==='negative'?[[-2,1],[-1,1]]:kind==='zero'?[[0,1]]:[[2,3],[1,2],[-1,2],[-2,3]];return Array.from({length:5},(_,i)=>{const[rise,run]=pool[i%pool.length],b=[1,0,2,-1,-2][i];if(level!=='4')return buildQuestion(rise,run,b);const p=i===0&&kind==='positive'?{x:1,y:2}:{x:[1,-1,0,-2,1][i],y:[1,0,2,-1,-2][i]};return buildQuestion(rise,run,p.y-rise*p.x/run,p)})}
function buildSteps(q){const out=[];const add=(type,cat,title,desc,formula,answer,result,hint)=>out.push({type,cat,title,desc,formula,answer,result,hint});
const plotBase=()=>add('point',1,'最初の点を打とう。',`原点から、横 ${n(q.p.x)}・縦 ${n(q.p.y)} の場所を選ぶ。`,point(q.p),q.p,`出発点 ${point(q.p)} を打てた。`,'最初の点は、原点を基準に座標を読む。');
const horizontal=()=>add('point',2,`この点から、右に ${q.run}。`,`出発点は ${point(q.p)}。原点に戻らず、同じ高さのまま右へ進もう。`,`${point(q.p)} から右に ${q.run}`,{x:q.q.x,y:q.p.y},`横に ${q.run} 進んだ。ここは途中の曲がり角。`,`横の位置は ${n(q.p.x)} + ${q.run} = ${n(q.q.x)}。縦は ${n(q.p.y)} のまま。`);
const vertical=()=>add('point',3,q.rise===0?'高さは変えず、到着点を選ぼう。':`そこから、${q.rise>0?'上':'下'}に ${Math.abs(q.rise)}。`,q.rise===0?'傾き０では上下に動かない。同じ場所を選んで、２点目にしよう。':'今の曲がり角から、縦に進む。横の位置は変えない。',movement(q),q.q,`到着点 ${point(q.q)} を打てた。`,q.rise===0?`到着点は ${point(q.q)}。出発点と同じ高さ。`:`縦の位置は ${n(q.p.y)}${q.rise>0?' + ':' − '}${Math.abs(q.rise)} = ${n(q.q.y)}。`);
if(level==='1'){add('number',0,'xに０を入れて、yを求めよう。','まずは１つ目の点に使う数字。',`y = ${slope(q)} × 0${tail(q.b)}`,q.p.y,`x = 0 のとき、y = ${n(q.p.y)}`,`０をかけると０。残る数は ${n(q.b)}。`);plotBase();add('number',0,`次はxに ${q.run} を入れよう。`,'２つ目の点に使うyの値を計算する。',`y = ${slope(q)} × ${q.run}${tail(q.b)}`,q.q.y,`x = ${q.run} のとき、y = ${n(q.q.y)}`,`${slope(q)} × ${q.run} = ${n(q.rise)}。そこに ${n(q.b)} を足す。`);add('point',3,'２つ目の点を打とう。',`原点から、横 ${q.run}・縦 ${n(q.q.y)} の場所を選ぶ。`,point(q.q),q.q,`２点 ${point(q.p)}、${point(q.q)} がそろった。`,'表の上がx、下がy。２点目も原点から座標を読む。')}
if(level==='2'){horizontal();vertical();add('slope',0,'この動きを、傾きで表すと？','傾きは「縦の変化 ÷ 横の変化」。',`${n(q.rise)} ÷ ${q.run} = ?`,slope(q),`傾きは ${slope(q)}。式のxにかかっている数と同じ。`,`縦に ${n(q.rise)}、横に ${q.run}。傾きは ${slope(q)}。`)}
if(level==='3'){add('number',0,'切片は、いくつ？','切片は、x = 0 のときのyの値。最初の点の高さになる。',equation(q),q.b,`切片 ${n(q.b)} → 最初の点 (0, ${n(q.b)})`, `xに０を入れると、y = ${n(q.b)}。`);plotBase();add('slope',0,'傾きは、いくつ？','xにかかっている数を読む。',equation(q),slope(q),`傾き ${slope(q)} → ${movement(q)}`,`傾きは ${slope(q)}。切片 ${n(q.b)} とは役割が違う。`);horizontal();vertical()}
if(level==='4'){plotBase();horizontal();vertical()}
add('line',3,'２点を通る直線を引こう。','線は、２点の間だけで終わらず、両方向に延ばす。',`${point(q.p)} と ${point(q.q)}`,null,'２点を通る直線ができた。','大きい２つの点を使う。途中の曲がり角は使わない。');return out}
function status(){const pending=$('level').value!==level||$('kind').value!==kind;$('status').textContent=(pending?'変更はまだ反映されていません。上のボタンで始めてください。 ':'')+`現在：段階${level} ${levels[level]} ／ 傾き：${kinds[kind]}。始めると問題と記録をリセットします。`}
function statView(){$('stats').innerHTML='<table class="table"><tr><th>場面</th><th>間違い</th></tr>'+names.map((v,i)=>`<tr><td>${v}</td><td>${stats[i]}回</td></tr>`).join('')+'</table>'}
function completed(i){return si>i||(si===i&&solved)}
function geometry(){if(directPoints!==null)return {base:directPoints.length>0,end:directPoints.length>1,elbow:false,line:directPoints.length>1};const q=questions[qi];let base=level==='2',end=false,elbow=false,line=false;steps.forEach((s,i)=>{if(completed(i)){if(s.type==='point'&&s.cat===1)base=true;if(s.type==='point'&&s.cat===2)elbow=true;if(s.type==='point'&&s.cat===3)end=true;if(s.type==='line')line=true}});return{base,end,elbow,line}}
function render(){const q=questions[qi];statView();$('counter').textContent=`③ · 段階${level} · ${qi+1} / 5 問目`;$('question').textContent=level==='4'?`点 ${point(q.p)} を通り、傾き ${slope(q)} の直線`:equation(q)+' のグラフをかこう。';$('question-note').textContent=level==='4'?'指定された点を出発点にして、傾きで次の点を作る。':levels[level];if(directPoints!==null){renderDirect();return}if(si===steps.length){finishQuestion();return}const s=steps[si];$('area').innerHTML=`${bridge&&qi===0?'<div class="bridge">さっきと同じ式と２点で、次のかき方を試そう。</div>':''}<div class="layout"><div class="graph-panel"><div id="board" class="board"></div><div id="quick-controls"></div><div class="legend"><span>緑：出発点・横の動き</span><span>茶色：到着点・縦の動き</span></div></div><div class="guide-panel"><ol class="steps">${['値を読む','点を打つ','横に進む','縦・直線'].map((t,i)=>`<li class="${s.cat===i?'active':''}" ${s.cat===i?'aria-current="step"':''}>${t}</li>`).join('')}</ol><h3 class="prompt">${s.title}</h3><p>${s.desc}</p><div id="origin-note" class="origin-note"></div><div id="formula" class="formula math">${s.formula}</div><div id="answers"></div><div id="picker" class="picker" ${s.type==='point'?'':'hidden'}><label>横（x）<select id="pick-x">${domain.map(v=>`<option value="${v}" ${v===0?'selected':''}>${n(v)}</option>`).join('')}</select></label><label>縦（y）<select id="pick-y">${domain.map(v=>`<option value="${v}" ${v===0?'selected':''}>${n(v)}</option>`).join('')}</select></label><button id="pick">この点を選ぶ</button><button id="confirm" class="primary" disabled>選んだ点を確定する</button></div><div id="feedback" class="feedback" role="status" aria-live="polite">${s.type==='point'?'図の点を押すか、横・縦の数字で選ぼう。':'自分のペースで１つずつ。'}</div><div class="actions"><button id="back" ${si===0?'disabled':''}>１つ前の手順に戻る</button><button id="hint">ヒントを見る</button><button id="next" class="primary" hidden>次の手順へ</button></div><div id="table"></div></div></div>`;
if(s.type==='number'||s.type==='slope'){const values=s.type==='number'?Array.from(new Set([s.answer,s.answer+1,s.answer-1,0,s.answer+2])).slice(0,4):Array.from(new Set([s.answer,'0','1','2','−2','1/2','2/3'])).slice(0,4);for(let i=values.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[values[i],values[j]]=[values[j],values[i]]}$('answers').innerHTML='<div class="choices">'+values.map((v,i)=>`<button data-answer="${i}">${typeof v==='number'?n(v):v}</button>`).join('')+'</div>';document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(values[Number(b.dataset.answer)],b))}else if(s.type==='line'){$('answers').innerHTML='<button id="line" class="primary">この２点を通る直線を引く</button>';$('line').onclick=()=>answer(null)}
$('back').onclick=back;$('hint').onclick=()=>{hinted=true;feedback(s.hint)};$('next').onclick=()=>{if(!solved)return;si++;solved=false;selected=null;hinted=false;render()};$('pick').onclick=()=>selectPoint(Number($('pick-x').value),Number($('pick-y').value));$('confirm').onclick=()=>{if(selected)answer(selected)};draw();tableView();quickControls()}

function currentPoints(){if(directPoints!==null)return directPoints;const g=geometry(),q=questions[qi];return g.end?[q.p,q.q]:g.base?[q.p]:[]}
function quickControls(){const host=$('quick-controls');if(!host)return;const pts=currentPoints(),done=pts.length===2;host.innerHTML=`<div class="feedback" role="status" aria-live="polite">１点目：${pts[0]?point(pts[0]):'未確定'}<br>２点目：${pts[1]?point(pts[1]):'未確定'}${selected&&!done?'<br>選択中：'+point(selected):''}</div><div class="actions"><button id="quick-confirm" class="primary" ${!selected||done?'disabled':''}>${pts.length===0?'１点目':'２点目'}を確定する</button>${directPoints!==null?'<button id="quick-back">１つ前に戻る</button>':''}${done&&directPoints!==null?`<button id="quick-next" class="primary">${qi===4?'５問を振り返る':'次の問題へ'}</button>`:''}</div><p id="quick-message" class="small" role="status" aria-live="polite">${done?'２点がそろいました。':'グラフだけでも解けます。直線上の異なる２点を選ぼう。'}</p>`;$('quick-confirm').onclick=confirmDirect;if(directPoints!==null)$('quick-back').onclick=back;if(done&&directPoints!==null)$('quick-next').onclick=()=>{if(qi===4)finishSet();else{qi++;load()}}}
function confirmDirect(){if(!selected)return;const pts=currentPoints();if(pts.length>=2)return;const q=questions[qi];if(pts.some(p=>p.x===selected.x&&p.y===selected.y)){$('quick-message').textContent='同じ点は２回使えません。別の点を選ぼう。';return}const valid=q.run*(selected.y-q.p.y)===q.rise*(selected.x-q.p.x);if(!valid){stats[pts.length?3:1]++;statView();$('quick-message').textContent=`${point(selected)} は、この直線上の点ではありません。下の誘導も使って、選び直そう。`;return}directPoints=[...pts,{...selected}];selected=null;solved=false;render()}
function renderDirect(){const q=questions[qi],pts=directPoints,done=pts.length===2,base=pts[0]||q.p;
const computations=pts.map((p,i)=>level==='4'?`${i+1}点目 ${point(p)}：指定点から横 ${n(p.x-q.p.x)}、縦 ${n(p.y-q.p.y)}`:`${i+1}点目：x = ${n(p.x)} → y = ${slope(q)} × ${par(p.x)}${tail(q.b)} = ${n(p.y)}`);
$('area').innerHTML=`<div class="layout"><div class="graph-panel"><div id="board" class="board"></div><div id="quick-controls"></div></div><div class="guide-panel"><h3 class="prompt">${done?'２点から直線ができた。':pts.length?'もう１つ、直線上の点を選ぼう。':'まずは直線上の点を１つ選ぼう。'}</h3><p>${done?'選んだ座標を、下の表と計算にも反映しました。':pts.length?`${point(base)} から ${movement(q)} と進むと、同じ直線上の次の点になる。盤面の外に出るなら、逆向きに進んでもよい。`:'代入で座標を求めても、切片と傾きを使ってもよい。'}</p><div id="origin-note" class="origin-note">${pts.length?'今の出発点は '+point(base)+'。':'最初の点は、原点から座標を読む。'}</div><div class="formula math">${level==='4'?'傾き '+slope(q):equation(q)}</div><table class="table"><tr><th></th><th>１点目</th><th>２点目</th></tr><tr><th>x</th><td>${pts[0]?n(pts[0].x):'?'}</td><td>${pts[1]?n(pts[1].x):'?'}</td></tr><tr><th>y</th><td>${pts[0]?n(pts[0].y):'?'}</td><td>${pts[1]?n(pts[1].y):'?'}</td></tr></table><div class="math">${computations.map(t=>'<p>'+t+'</p>').join('')}</div>${done?`<p>縦の変化 ${n(pts[1].y-pts[0].y)} ÷ 横の変化 ${n(pts[1].x-pts[0].x)} = 傾き ${slope(q)}</p>`:''}<div id="feedback" class="feedback" role="status" aria-live="polite">${done?'直線を両方向に延ばしました。グラフの下から次の問題へ進めます。':'右へ進むとき、正の傾きなら上、負の傾きなら下。逆向きに進むなら、縦も逆にする。'}</div>${!done?`<div class="picker"><label>横（x）<select id="pick-x">${domain.map(v=>`<option value="${v}" ${v===base.x?'selected':''}>${n(v)}</option>`).join('')}</select></label><label>縦（y）<select id="pick-y">${domain.map(v=>`<option value="${v}" ${v===base.y?'selected':''}>${n(v)}</option>`).join('')}</select></label><button id="pick">この点を選ぶ</button></div>`:''}<div class="actions"><button id="guided-restart">１手ずつの誘導でやり直す</button></div></div></div>`;
if(!done)$('pick').onclick=()=>selectPoint(Number($('pick-x').value),Number($('pick-y').value));$('guided-restart').onclick=load;draw();quickControls();$('origin-note').textContent=pts.length?'ここから出発：'+point(base)+'。原点には戻らない。':'最初の点は、原点から座標を読む。'}

function tableView(){const q=questions[qi];if(level!=='1'&&level!=='2')return;const first=level==='2'||completed(0),second=level==='2'||completed(2);$('table').innerHTML=`<table class="table" style="margin-top:18px"><tr><th>x</th><td>0</td><td>${q.run}</td></tr><tr><th>y</th><td>${first?n(q.p.y):'?'}</td><td>${second?n(q.q.y):'?'}</td></tr></table>`}
function clipLine(q){const p=q.p,dx=q.run,dy=q.rise;let lo=-Infinity,hi=Infinity;for(const [v,d]of [[p.x,dx],[p.y,dy]]){if(d===0){if(v< -4||v>4)return null;continue}const a=(-4-v)/d,b=(4-v)/d;lo=Math.max(lo,Math.min(a,b));hi=Math.min(hi,Math.max(a,b))}return [{x:p.x+lo*dx,y:p.y+lo*dy},{x:p.x+hi*dx,y:p.y+hi*dy}]}
function draw(){const original=questions[qi],q=directPoints!==null?{...original,p:directPoints[0]||original.p,q:directPoints[1]||original.q}:original,g=geometry(),s=steps[si],X=x=>38+(x+4)*40,Y=y=>358-(y+4)*40;const canPick=directPoints!==null?directPoints.length<2:si<steps.length&&!geometry().line;let svg='<svg viewBox="0 0 400 400" role="group" aria-label="座標図。横x、縦y。−4から4。">';for(const v of domain){svg+=`<line class="grid" x1="${X(v)}" x2="${X(v)}" y1="38" y2="358"/><line class="grid" x1="38" x2="358" y1="${Y(v)}" y2="${Y(v)}"/>`}
svg+=`<line class="axis" x1="24" x2="373" y1="${Y(0)}" y2="${Y(0)}"/><line class="axis" x1="${X(0)}" x2="${X(0)}" y1="24" y2="373"/><text class="tick" x="381" y="${Y(0)+5}">x</text><text class="tick" x="${X(0)-4}" y="17">y</text>`;for(const v of domain){svg+=`<text class="tick" x="${X(v)}" y="${Y(0)+20}" text-anchor="middle">${n(v)}</text>`;if(v!==0)svg+=`<text class="tick" x="${X(0)-10}" y="${Y(v)+5}" text-anchor="end">${n(v)}</text>`}
if(g.line){const seg=clipLine(q);svg+=`<line class="line" x1="${X(seg[0].x)}" y1="${Y(seg[0].y)}" x2="${X(seg[1].x)}" y2="${Y(seg[1].y)}"/>`}
if(g.elbow){svg+=`<path class="pathx" d="M ${X(q.p.x)} ${Y(q.p.y)} H ${X(q.q.x)}"/><rect x="${X(q.q.x)-3}" y="${Y(q.p.y)-3}" width="6" height="6" fill="#647a86"/>`}
if(g.end&&level!=='1'&&directPoints===null)svg+=`<path class="pathy" d="M ${X(q.q.x)} ${Y(q.p.y)} V ${Y(q.q.y)}"/>`;
if(level==='2'&&!g.end&&directPoints===null)svg+=`<circle cx="${X(q.q.x)}" cy="${Y(q.q.y)}" r="9" fill="none" stroke="#a75f0c" stroke-dasharray="3 3" stroke-width="2"/>`;
for(const x of domain)for(const y of domain)svg+=`<circle class="dot" cx="${X(x)}" cy="${Y(y)}" r="2"/><circle class="hit" cx="${X(x)}" cy="${Y(y)}" r="18" role="button" tabindex="${canPick?'0':'-1'}" aria-disabled="${!canPick}" aria-label="横${n(x)}、縦${n(y)}の点" data-x="${x}" data-y="${y}"/>`;
if(g.base){svg+=`<circle class="base" cx="${X(q.p.x)}" cy="${Y(q.p.y)}" r="7" pointer-events="none"/>`;if(s&&s.cat===2)svg+=`<circle cx="${X(q.p.x)}" cy="${Y(q.p.y)}" r="13" fill="none" stroke="#087766" stroke-width="2" pointer-events="none"/>`}
if(g.end)svg+=`<circle class="endpoint" cx="${X(q.q.x)}" cy="${Y(q.q.y)}" r="7" pointer-events="none"/>`;
if(selected&&canPick)svg+=`<circle cx="${X(selected.x)}" cy="${Y(selected.y)}" r="10" fill="none" stroke="#177fc1" stroke-width="3" pointer-events="none"/>`;
svg+='<text class="tick" x="16" y="389">緑・茶色の大きい点を直線で結ぶ。</text></svg>';$('board').innerHTML=svg;
if($('origin-note'))$('origin-note').textContent=s?.type==='point'?(s.cat===2?`ここから出発：${point(q.p)}。原点には戻らない。`:s.cat===3&&level!=='1'?`曲がり角 ${point({x:q.q.x,y:q.p.y})} から縦に進む。`:'原点 (0, 0) を基準に、点の位置を読む。'):'横・縦の移動量で、傾きが決まる。';
document.querySelectorAll('[data-x]').forEach(el=>{const f=()=>{if(canPick)selectPoint(Number(el.dataset.x),Number(el.dataset.y))};el.onclick=f;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();f()}}})}
function feedback(text,cls=''){$('feedback').textContent=text;$('feedback').className='feedback '+cls}
function selectPoint(x,y){if((directPoints!==null?directPoints.length>=2:si>=steps.length||geometry().line)||!domain.includes(x)||!domain.includes(y))return;selected={x,y};if($('pick-x'))$('pick-x').value=String(x);if($('pick-y'))$('pick-y').value=String(y);if($('confirm'))$('confirm').disabled=solved;feedback(`選んだ点は ${point(selected)}。よければ確定しよう。`);draw();quickControls()}
function answer(value,btn){if(solved)return;const s=steps[si];const ok=s.type==='point'?value&&value.x===s.answer.x&&value.y===s.answer.y:value===s.answer;if(!ok){stats[s.cat]++;statView();if(btn)btn.classList.add('wrong');feedback((s.type==='point'?`選んだ点は ${point(value)}。 `:'もう一度見てみよう。 ')+s.hint,'retry');return}solved=true;if(btn)btn.classList.add('correct');$('formula').textContent=s.type==='number'?s.result:s.type==='slope'?`傾き ${s.answer}`:s.type==='point'?point(s.answer):s.formula;feedback(s.result,'good');document.querySelectorAll('#answers button,#picker button,#picker select').forEach(e=>e.disabled=true);$('hint').hidden=true;$('next').hidden=false;$('next').textContent=si===steps.length-1?'できたグラフを確認する':'次の手順へ';draw();tableView();quickControls();$('next').focus()}
function back(){if(directPoints!==null){directPoints.pop();selected=null;solved=false;render();return}if(si===0)return;si--;solved=false;selected=null;hinted=false;render()}
function finishQuestion(){const q=questions[qi];$('area').innerHTML=`<div class="layout"><div class="graph-panel"><div id="board" class="board"></div></div><div class="guide-panel"><div class="result"><h2>直線がかけた。</h2><p>出発点：${point(q.p)}<br>もう１つの点：${point(q.q)}</p><p><strong>${movement(q)}</strong><br>傾き = ${n(q.rise)} ÷ ${q.run} = ${slope(q)}</p></div><p>${level==='1'?'代入で求めた２点の間にも、この横・縦の動きがある。':level==='4'?'切片の場所でなくても、直線上の点と傾きがわかればかける。':'切片で出発点を決め、傾きでもう１つの点を作る。'}</p><div class="actions"><button id="back">１つ前の手順に戻る</button><button id="repeat">この問題をもう一度</button><button id="advance" class="primary">${qi===4?'５問を振り返る':'次の問題へ'}</button></div></div></div>`;draw();$('back').onclick=back;$('repeat').onclick=load;$('advance').onclick=()=>{if(qi===4)finishSet();else{qi++;load()}}}
function load(){directPoints=null;steps=buildSteps(questions[qi]);si=0;solved=false;selected=null;hinted=false;render()}
function finishSet(){$('area').innerHTML=`<div class="result"><h2>５本の直線をかけた。</h2><p>点を１つ決める。傾きでもう１つの点を作る。<br>２点を通る直線を両方向に延ばす。</p></div><div class="actions">${level!=='4'?'<button id="next-level" class="primary">次の段階へ</button>':''}<button id="again">この段階をもう一度</button></div>`;if(level!=='4')$('next-level').onclick=()=>{const prev=questions[4];level=String(Number(level)+1);$('level').value=level;questions=makeSet();bridge=level!=='4';if(bridge)questions[0]=prev;qi=0;load();status()};$('again').onclick=()=>{questions=makeSet();qi=0;bridge=false;load()}}
function start(){level=$('level').value;kind=$('kind').value;questions=makeSet();qi=0;stats=[0,0,0,0];bridge=false;load();status()}
$('level').onchange=status;$('kind').onchange=status;$('apply').onclick=()=>{start();$('counter').scrollIntoView({block:'start',behavior:'instant'})};start();
})();
</script></body></html>
