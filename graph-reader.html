rgin:auto;max-width:355px;border:1px solid #71a99d;border-radius:10px;padding:9px 10px;background:#fffffffa;box-shadow:0 3px 12px #17354420}.popup.bottom{bottom:8px}.popup.top{top:8px}.pop-title{font-size:15px;font-weight:650;margin:0 0 6px}.pop-row{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap}.pop-row .symbol{font-size:24px}.popup form{margin:0}.popup .message{font-size:13px;line-height:1.4;margin:6px 0 0;color:#83500a}.pop-sub{font-size:13px;color:#48636f;margin:0 0 6px}.popup .coord{width:65px;height:42px;font-size:21px;text-align:center;border:1px solid #abc3cb;border-radius:6px}.rational{display:inline-flex;align-items:center;gap:4px;vertical-align:middle}.fraction-stack{display:flex;flex-direction:column;width:65px;gap:2px}.rational input{width:100%;min-width:0;height:40px;padding:3px;text-align:center;font-size:21px;border:1px solid #abc3cb;background:white;border-radius:6px}.rational .denominator{border-top:2px solid #193247;border-radius:0 0 5px 5px}.field-tools{display:flex;flex-direction:column;gap:3px}.field-tools button{font-size:12px;padding:3px 5px;min-height:27px}.equation{display:flex;justify-content:center;align-items:center;gap:7px;margin:8px 0}.equation>span{font-size:23px;white-space:nowrap}.eq-field{display:flex;flex-direction:column;align-items:center;gap:3px}.eq-field>label{font-size:12px;color:#456371}.equation .fraction-stack{width:58px}.equation .field-tools button{font-size:11px;min-height:25px;padding:2px 4px}.action-row{display:flex;gap:7px}.action-row button{flex:1}.direct-message{padding:8px 10px;background:#e2f3eb;border-radius:8px;font-size:14px;margin:8px 0}.direct-message.retry{background:#fff0d8;color:#744609}.details-zone{margin-top:26px;border-top:1px solid #ccdae1;padding-top:14px}summary{min-height:40px;cursor:pointer;font-size:14px}.table{width:100%;border-collapse:collapse;font-size:14px}.table th,.table td{padding:7px;border-bottom:1px solid #d2dfe6;text-align:center}.guide-copy{font-size:14px}.result{padding:14px;background:#e3f3ec;border-radius:10px}.result h2{font-size:19px}.read-controls{display:flex;gap:5px;align-items:center}.sign{font-size:13px;min-height:40px;padding:5px 7px}[hidden]{display:none!important}@media(max-width:360px){main{padding-left:5px;padding-right:5px}.equation{gap:4px}.equation .fraction-stack{width:51px}.equation>span{font-size:21px}.popup{left:5px;right:5px;padding:8px}.fraction-stack{width:60px}}
.pop-title{cursor:grab;touch-action:none;user-select:none;padding-right:22px;position:relative;min-height:28px;display:flex;align-items:center}.pop-title::after{content:"⠿";position:absolute;right:0;color:#6c8790;font-size:20px}.popup.dragging .pop-title{cursor:grabbing}.pop-title:focus-visible{outline:2px solid #147ab8;outline-offset:2px}
.rational{flex-direction:column;align-items:center;width:100%;gap:5px}.field-tools{width:100%;align-items:stretch;gap:4px}.field-tools button,.equation .field-tools button{font-size:11px;min-height:32px;padding:5px 3px;white-space:nowrap}.equation{display:grid;grid-template-columns:auto minmax(0,1fr) auto minmax(0,1fr);align-items:start;gap:6px}.equation>span{padding-top:26px}.equation:has(.denominator:not([hidden]))>span{padding-top:46px}.eq-field{min-width:0}.eq-field>div{width:100%}.equation .fraction-stack{width:100%;max-width:86px}.popup .rational{width:112px}.read-controls{flex-direction:column;align-items:center;gap:4px}.read-controls .sign{font-size:11px;min-height:32px;padding:5px 3px;white-space:nowrap}.pop-row{align-items:flex-start}.pop-row .symbol{padding-top:5px}.pop-row>.pop-sub{padding-top:8px}.pop-row>button{align-self:flex-start}@media(max-width:360px){.equation{gap:4px}.equation .fraction-stack{width:100%}.field-tools button,.equation .field-tools button{font-size:11px}}
</style></head><body><main>
<div class="bar"><button id="settings-toggle" aria-expanded="false" aria-controls="setup" aria-label="設定を開く">≫</button><span class="meta" id="counter"></span><button id="guide-toggle" aria-pressed="true">誘導 ON</button><button id="move-popup" aria-label="ポップアップの位置を上下に切り替える">↕</button></div>
<section id="setup" class="setup" hidden><h1>グラフから、式へ。④</h1><div class="settings"><label>段階<select id="level"><option value="1">１ · 切片と傾きを１つずつ</option><option value="2">２ · 自分で２点を選ぶ</option><option value="3">３ · ２点から切片も求める</option><option value="4">４ · 誘導なしで式を答える</option></select></label><label class="check"><input id="check-coords" type="checkbox" checked>点を選んだら座標も答える</label><button id="apply" class="primary">この条件で５問を始める</button></div><p id="status" class="small"></p><p>この直線の式を求めよう。</p></section>
<div class="graph-wrap"><div id="board" class="board"></div><section id="popup" class="popup bottom" aria-label="グラフの誘導と入力" hidden></section></div>
<form id="equation-form"><div class="equation"><span>y =</span><div class="eq-field"><label for="a">傾き</label><div id="field-a"></div></div><span>x ＋</span><div class="eq-field"><label for="b">切片</label><div id="field-b"></div></div></div><div class="action-row"><button id="quick-back" type="button">戻る</button><button id="equation-submit" class="primary" type="submit">式を確定</button><button id="quick-next" class="primary" type="button" hidden>次へ</button></div></form><div id="direct-feedback" class="direct-message" role="status" aria-live="polite" hidden></div>
<div class="details-zone"><details><summary>詳しい説明・読んだ座標を見る</summary><div id="guide" class="guide-copy"></div><div id="known"></div></details><details><summary>教える人へ · 今回の記録</summary><p class="small">間違いの回数です。新しく始めるとリセット。保存はされません。</p><div id="stats"></div></details></div>
</main><script>
(()=>{'use strict';
const $=id=>document.getElementById(id),n=x=>String(x).replace('-','−'),pair=p=>`(${n(p.x)}, ${n(p.y)})`,domain=Array.from({length:9},(_,i)=>i-4);
function f(x){if(Math.abs(x)<1e-10)return '0';for(let d=1;d<=24;d++)if(Math.abs(x*d-Math.round(x*d))<1e-9)return d===1?n(Math.round(x)):n(Math.round(x*d))+'/'+d;return n(Number(x.toFixed(4)))}
function parse(raw){const s=raw.normalize('NFKC').replace(/−/g,'-').trim();if(!/^[+-]?(?:\d+(?:\.\d+)?|\.\d+)(?:\/[+-]?\d+)?$/.test(s))return null;const [a,b='1']=s.split('/').map(Number);if(!b)return null;const value=a/b;return Number.isFinite(value)?value:null}
const eq=(a,b)=>'y = '+(a===1?'x':a===-1?'−x':a===0?'0':(Number.isInteger(a)?f(a):'('+f(a)+')')+'x')+(b===0?'':b<0?' − '+f(-b):' + '+f(b));
const banks={1:[[2,1],[1,2],[-1,1],[0,-1],[-2,2]],2:[[2,1],[.5,1],[-1,2],[0,2],[-.5,-1]],3:[[.5,.5],[2/3,1/3],[-.5,.5],[1.5,.5],[-2/3,1/3]],4:[[2,1],[-1,2],[.5,.5],[0,-1],[2/3,1/3]]};
const levelNames={'1':'切片と傾きを１つずつ','2':'自分で２点を選ぶ','3':'２点から切片も求める','4':'誘導なしで式を答える'};
let guideOn=true,popupSide='bottom',popupPosition=null,dragState=null;
let level='1',checkCoords=true,questions=[],qi=0,st={},stack=[],stats=[0,0,0,0],draftA='',draftB='',hint=false;
const operand=v=>v<0?'('+f(v)+')':f(v);
const q=()=>questions[qi],near=(a,b)=>Math.abs(a-b)<1e-8,onLine=p=>near(q().a*p.x+q().b,p.y);
function route(){return level==='3'||(level==='4'&&!Number.isInteger(q().b))?'two':level==='1'?'simple':'choose'}
function start(){level=$('level').value;guideOn=level!=='4';checkCoords=$('check-coords').checked;questions=banks[level].map(([a,b])=>({a,b}));qi=0;stats=[0,0,0,0];load();settingsStatus()}
function load(){resetPopupPosition();popupSide='bottom';st={phase:route()==='two'?'pickA':'pickI',points:{},read:{},slopeKnown:false,bKnown:false};stack=[];draftA='';draftB='';hint=false;render()}
function save(){stack.push({st:JSON.parse(JSON.stringify(st)),draftA,draftB});hint=false}
function advance(phase){save();st.phase=phase;render()}
function back(){if(!stack.length)return;const prev=stack.pop();st=prev.st;draftA=prev.draftA;draftB=prev.draftB;hint=false;render()}
function settingsStatus(){const pending=$('level').value!==level||$('check-coords').checked!==checkCoords;$('status').textContent=(pending?'変更はまだ反映されていません。上のボタンを押してください。 ':'')+`現在：段階${level} ${levelNames[level]} ／ 座標の確認${checkCoords?'あり':'なし'}。始めると問題と記録をリセットします。`}
function statView(){$('stats').innerHTML='<table class="table"><tr><th>場面</th><th>間違い</th></tr>'+['点を選ぶ','座標を読む','変化・傾き・切片の計算','式を作る'].map((v,i)=>`<tr><td>${v}</td><td>${stats[i]}回</td></tr>`).join('')+'</table>'}
function info(){const p=st.phase,A=st.points.A,B=st.points.B;switch(p){
case'intro':return ['まずは、グラフから式を答えよう。','上の傾きa・切片bに数字を入れる。困ったら下のボタンで誘導を始められる。'];
case'pickI':return ['y軸と直線が交わる点を押そう。','y軸は、x = 0 の縦の軸。その軸と直線の交点を探す。'];
case'readI':case'readA':case'readB':return ['選んだ点の座標は？','左の欄が横の位置（x）、右の欄が縦の位置（y）。原点を基準に読む。'];
case'intercept':return ['切片は、いくつ？',`y軸との交点は ${pair(st.points.I)}。x = 0 のときのyの値を答えよう。`];
case'pickA':return ['直線上の格子点を１つ選ぼう。','目盛りの交点にぴったり重なる点を選ぶ。これを点Aにする。'];
case'pickB':return [route()==='simple'?'点Aから右に１の、直線上の点を押そう。':'別の、直線上の格子点を選ぼう。',route()==='simple'?'横の位置が１増えた先で、直線と重なる点を選ぶ。':'点Aとは違う点を選ぶ。右に１離れていなくてもよい。'];
case'dx':return ['横の変化は、いくつ？',`A ${pair(A)} から B ${pair(B)}。横の変化 = Bのx − Aのx。`];
case'dy':return ['縦の変化は、いくつ？',`A ${pair(A)} から B ${pair(B)}。縦の変化 = Bのy − Aのy。`];
case'slope':return ['傾きは、いくつ？',`縦の変化 ${f(B.y-A.y)} ÷ 横の変化 ${f(B.x-A.x)}。分数でも入力できる。`];
case'substitute':return ['点Aの座標を、式に入れよう。',`傾き ${f(q().a)} はわかった。y = ax + b に、点A ${pair(A)} のxとyを入れる。`];
case'b':return ['残ったbを求めよう。',`${f(A.y)} = ${f(q().a)} × (${f(A.x)}) + b。b = ${f(A.y)} − (${f(q().a*A.x)}) は？`];
case'assemble':return ['傾きと切片を、式に入れよう。','求めた数を上の入力欄に反映したよ。aはxにかかる数、bは切片。「この式で確定する」を押そう。'];
case'done':return ['式ができた。',eq(q().a,q().b)];}}
function expected(){const A=st.points.A,B=st.points.B;return {intercept:q().b,dx:A&&B?B.x-A.x:null,dy:A&&B?B.y-A.y:null,slope:q().a,b:q().b}[st.phase]}
const fractionModes={};
function fieldValue(id){const top=$(id)?.value||'';return fractionModes[id]?top+'/'+($(id+'-den')?.value||''):top}
function mountField(id,raw='',force){const host=$('field-'+id);if(!host)return;const pieces=raw.replace(/−/g,'-').split('/');const fractional=force===undefined?pieces.length===2:force;fractionModes[id]=fractional;const top=pieces[0],den=pieces[1]||'1';host.innerHTML=`<span class="rational"><span class="fraction-stack"><input id="${id}" type="text" inputmode="decimal" autocomplete="off" aria-label="${id==='a'?'傾き':id==='b'?'切片':'答え'}${fractional?'の分子':''}" value=""><input id="${id}-den" class="denominator" type="text" inputmode="numeric" autocomplete="off" aria-label="分母" ${fractional?'':'hidden'}></span><span class="field-tools"><button id="${id}-fraction" type="button" aria-pressed="${fractional}" aria-label="分数入力を切り替える">${fractional?'分数 OFF':'分数 ON'}</button><button id="${id}-sign" type="button" aria-label="マイナスをつける">マイナスをつける</button></span></span>`;$(id).value=fractional?top:raw;$(id+'-den').value=den;
const sync=()=>{updateSignLabel(id);if(id==='a')draftA=fieldValue(id);if(id==='b')draftB=fieldValue(id)};
$(id).oninput=sync;$(id+'-den').oninput=sync;$(id+'-sign').onclick=()=>{flipSign(id);sync()};$(id+'-fraction').onclick=()=>{const value=fieldValue(id);mountField(id,value,!fractionModes[id]);sync()};updateSignLabel(id);}
function updateSignLabel(id){const button=$(id+'-sign');if(!button)return;const negative=$(id).value.normalize('NFKC').trim().replace(/−/g,'-').startsWith('-');const label=negative?'マイナスをはずす':'マイナスをつける';button.textContent=label;button.setAttribute('aria-label',label)}
function flipSign(id){const input=$(id),value=input.value.normalize('NFKC').trim().replace(/−/g,'-');input.value=value.startsWith('-')?value.slice(1):'-'+value.replace(/^\+/,'');updateSignLabel(id)}

function setSettings(open){$('setup').hidden=!open;$('settings-toggle').textContent=open?'≪':'≫';$('settings-toggle').setAttribute('aria-expanded',String(open));$('settings-toggle').setAttribute('aria-label',open?'上部をたたむ':'設定を開く')}
function updateGuideButton(){$('guide-toggle').textContent='誘導 '+(guideOn?'ON':'OFF');$('guide-toggle').setAttribute('aria-pressed',String(guideOn))}
function guideMessage(text,error=false){if($('pop-message')){$('pop-message').hidden=false;$('pop-message').textContent=text}$('guide').innerHTML='<p>'+info()[1]+'</p><p>'+text+'</p>';}
function render(){statView();$('counter').textContent=`④ · 段階${level} · ${qi+1}/5`;
mountField('a',draftA);mountField('b',draftB);const done=st.phase==='done';['a','a-den','a-sign','a-fraction','b','b-den','b-sign','b-fraction'].forEach(id=>$(id).disabled=done);$('quick-back').disabled=!stack.length;$('equation-submit').hidden=done;$('quick-next').hidden=!done;$('quick-next').textContent=qi===4?'５問終了':'次の問題';$('direct-feedback').hidden=!done;if(done){$('direct-feedback').className='direct-message';$('direct-feedback').textContent='正解　'+eq(q().a,q().b)}$('guide').innerHTML='<h3>'+info()[0]+'</h3><p>'+info()[1]+'</p>';renderKnown();draw();renderPopup();updateGuideButton()}
function signedCoordinate(id,label){return `<span class="read-controls"><input class="coord" id="${id}" type="text" inputmode="decimal" autocomplete="off" aria-label="${label}"><button id="${id}-sign" class="sign" type="button" aria-label="マイナスをつける">マイナスをつける</button></span>`}
function renderPopup(){const host=$('popup'),phase=st.phase;host.hidden=(!guideOn&&!phase.startsWith('read'))||phase==='done'||phase==='finished';if(host.hidden){host.innerHTML='';return}
let title='',body='';
if(phase==='pickI'){title='切片は？';body='<p class="pop-sub">まず、y軸と直線の交点を押そう。</p>'}
else if(phase==='pickA'){title='直線上の格子点を１つ押そう。'}
else if(phase==='pickB'){title=route()==='simple'?'右に１。直線上の次の点は？':'直線上の別の格子点を押そう。'}
else if(phase.startsWith('read')){title='この点の座標は？';body=`<form id="coord-form" class="pop-row"><span class="symbol">（</span>${signedCoordinate('coord-x','横の座標')}<span class="symbol">,</span>${signedCoordinate('coord-y','縦の座標')}<span class="symbol">）</span><button class="primary" type="submit">確定</button></form>`;const p=st.points[phase.slice(4)];popupSide=p.y>=0?'bottom':'top'}
else if(['intercept','dx','dy','slope','b'].includes(phase)){title={intercept:'切片は、いくつ？',dx:'横の変化は？',dy:'縦の変化は？',slope:'傾きは？',b:'切片 b は？'}[phase];const A=st.points.A,B=st.points.B;const short=phase==='intercept'?`x = 0 のときの y。`:phase==='dx'?`${n(B.x)} − ${operand(A.x)} =`:phase==='dy'?`${n(B.y)} − ${operand(A.y)} =`:phase==='slope'?`${operand(B.y-A.y)} ÷ ${operand(B.x-A.x)} =`:`${f(A.y)} − (${f(q().a)} × ${operand(A.x)}) =`;body=`<form id="number-form"><div class="pop-row"><span class="pop-sub">${short}</span><span id="field-number"></span><button class="primary" type="submit">確定</button></div></form>`}
else if(phase==='substitute'){title='点Aの数字を、xとyに入れよう。';body=`<form id="sub-form"><div class="pop-row"><span>x</span>${signedCoordinate('sub-x','xに入れる数字')}<span>y</span>${signedCoordinate('sub-y','yに入れる数字')}<button type="submit" class="primary">確定</button></div></form>`}
else if(phase==='assemble'){title='式に入った数字を確認しよう。';body='<p class="pop-sub">下の「式を確定」を押そう。</p>'}
else if(phase==='intro'){title='式を直接答えるか、点を選ぼう。'}
// Keep the first intercept visible, including when it lies below the origin.
if(phase==='pickI')popupSide=q().b>=0?'bottom':'top';
if(phase==='pickB'&&st.points.A)popupSide=st.points.A.y>=0?'bottom':'top';
host.className='popup '+popupSide;host.innerHTML=`<p class="pop-title" tabindex="0" aria-roledescription="移動ハンドル" aria-label="${title}。ドラッグまたは矢印キーで移動">${title}</p>${body}<p id="pop-message" class="message" role="status" aria-live="polite" hidden></p>`;
if(phase.startsWith('read')){$('coord-form').onsubmit=e=>{e.preventDefault();submitCoords($('coord-x').value,$('coord-y').value)};$('coord-x-sign').onclick=()=>flipSign('coord-x');$('coord-y-sign').onclick=()=>flipSign('coord-y');$('coord-x').oninput=()=>updateSignLabel('coord-x');$('coord-y').oninput=()=>updateSignLabel('coord-y')}
if(['intercept','dx','dy','slope','b'].includes(phase)){mountField('number','');$('number-form').onsubmit=e=>{e.preventDefault();submitNumber(fieldValue('number'))}}
placePopup();
if(phase==='substitute'){$('sub-form').onsubmit=e=>{e.preventDefault();submitSub($('sub-x').value,$('sub-y').value)};$('sub-x-sign').onclick=()=>flipSign('sub-x');$('sub-y-sign').onclick=()=>flipSign('sub-y');$('sub-x').oninput=()=>updateSignLabel('sub-x');$('sub-y').oninput=()=>updateSignLabel('sub-y')}
}

function renderKnown(){const rows=Object.keys(st.points).filter(k=>st.read[k]);$('known').innerHTML=rows.length?'<table class="table"><caption>読めた座標（この数字を使って計算する）</caption><tr><th>点</th><th>x</th><th>y</th></tr>'+rows.map(k=>`<tr><th>${k==='I'?'y軸との交点':k}</th><td>${n(st.points[k].x)}</td><td>${n(st.points[k].y)}</td></tr>`).join('')+'</table>':''}
function selectPoint(x,y){if(!st.phase.startsWith('pick')||!domain.includes(x)||!domain.includes(y))return;const p={x,y},key=st.phase.slice(4);let valid=onLine(p);if(key==='I')valid=valid&&x===0;if(key==='B')valid=valid&&!(x===st.points.A.x&&y===st.points.A.y)&&(route()!=='simple'||x===st.points.A.x+1);if(!valid){stats[0]++;statView();guideMessage(key==='I'?'y軸と直線の交点を探そう。':key==='B'&&x===st.points.A.x&&y===st.points.A.y?'点Aとは別の点を選ぼう。':route()==='simple'&&key==='B'?'点Aから右に１の位置で、直線に重なる点を探そう。':'直線が格子の交点を通る場所を探そう。',true);return}save();st.points[key]=p;st.phase='read'+key;if(!checkCoords){st.read[key]=true;afterRead(key)}render()}
function afterRead(key){st.phase=key==='I'?'intercept':key==='A'?'pickB':'dx'}
function submitCoords(x,y){const key=st.phase.slice(4),p=st.points[key],a=parse(x),b=parse(y);if(a===null||b===null){guideMessage('横と縦の両方に数字を入れよう。',true);return}if(a!==p.x||b!==p.y){stats[1]++;statView();guideMessage(a!==p.x&&b!==p.y?'横と縦を、原点から読み直そう。':a!==p.x?'横の位置（x）を読み直そう。':'縦の位置（y）を読み直そう。',true);return}save();st.read[key]=true;afterRead(key);render()}
function submitNumber(raw){const v=parse(raw);if(v===null){guideMessage('数字を入れよう。分数は「1/2」の形で入力できる。',true);return}if(!near(v,expected())){stats[2]++;statView();guideMessage(st.phase==='slope'?'傾きは縦の変化÷横の変化。点のy座標そのものではないよ。':'説明の式を、順に計算してみよう。',true);return}save();switch(st.phase){case'intercept':st.bKnown=true;draftB=f(v);if(st.slopeKnown)st.phase='assemble';else if(route()==='simple'){st.points.A={...st.points.I};st.read.A=true;st.phase='pickB'}else st.phase='pickA';break;case'dx':st.dx=v;st.phase='dy';break;case'dy':st.dy=v;st.phase='slope';break;case'slope':st.slopeKnown=true;draftA=f(v);st.phase=route()==='two'?'substitute':st.bKnown?'assemble':'intercept';break;case'b':st.bKnown=true;draftB=f(v);st.phase='assemble'}render()}
function submitSub(x,y){const a=parse(x),b=parse(y),p=st.points.A;if(a===null||b===null){guideMessage('xとyに入れる数字を、両方答えよう。',true);return}if(a!==p.x||b!==p.y){stats[2]++;statView();guideMessage('読めた座標の表を見よう。xは横、yは縦の数字。',true);return}advance('b')}
function submitEquation(){if(st.phase==='done')return;draftA=fieldValue('a');draftB=fieldValue('b');const a=parse(draftA),b=parse(draftB);$('direct-feedback').hidden=false;if(a===null||b===null){$('direct-feedback').textContent='傾きaと切片bを、両方入力しよう。分数ボタンで分子・分母を別々に入力できる。';return}if(!near(a,q().a)||!near(b,q().b)){stats[3]++;statView();$('direct-feedback').className='direct-message retry';$('direct-feedback').textContent='まだ、この直線の式とは一致していません。誘導をONにして、座標や変化を確かめよう。';return}save();st.phase='done';draftA=f(q().a);draftB=f(q().b);render()}
function showHint(){hint=true;const p=st.phase;const text=p.startsWith('read')?'選んだ点から軸へ補助線を出したよ。x軸で横の位置、y軸で縦の位置を読もう。':p==='dx'?'点Bのxから、点Aのxを引く。左へ進んだら負の数。':p==='dy'?'点Bのyから、点Aのyを引く。下へ進んだら負の数。':p==='slope'?'傾き = 縦の変化 ÷ 横の変化。両方負なら、傾きは正になる。':p==='intercept'?'切片は、y軸と交わる点のy座標。xは０。':p==='b'?'y = ax + b から、b = y − ax。点Aの数字を使う。':'直線上で、目盛りの交点にぴったり重なる点を探そう。';guideMessage(text);draw()}
function clip(){const{a,b}=q();const pts=[];for(const x of [-4,4]){const y=a*x+b;if(y>=-4&&y<=4)pts.push({x,y})}if(a!==0)for(const y of [-4,4]){const x=(y-b)/a;if(x>=-4&&x<=4&&!pts.some(p=>near(p.x,x)&&near(p.y,y)))pts.push({x,y})}return pts.slice(0,2)}
function draw(){const X=x=>38+(x+4)*40,Y=y=>358-(y+4)*40,canPick=st.phase.startsWith('pick'),seg=clip();let svg='<svg viewBox="0 0 400 400" role="group" aria-label="式を読み取る座標図。横がx、縦がy。目盛りは−4から4。">';for(const v of domain)svg+=`<line class="grid" x1="${X(v)}" x2="${X(v)}" y1="38" y2="358"/><line class="grid" x1="38" x2="358" y1="${Y(v)}" y2="${Y(v)}"/>`;svg+=`<line class="axis" x1="24" x2="375" y1="${Y(0)}" y2="${Y(0)}"/><line class="axis" x1="${X(0)}" x2="${X(0)}" y1="24" y2="375"/><text class="tick" x="382" y="${Y(0)+5}">x</text><text class="tick" x="${X(0)-4}" y="17">y</text>`;for(const v of domain){svg+=`<text class="tick" x="${X(v)}" y="${Y(0)+20}" text-anchor="middle">${n(v)}</text>`;if(v!==0)svg+=`<text class="tick" x="${X(0)-10}" y="${Y(v)+5}" text-anchor="end">${n(v)}</text>`}svg+=`<line class="line" x1="${X(seg[0].x)}" y1="${Y(seg[0].y)}" x2="${X(seg[1].x)}" y2="${Y(seg[1].y)}"/>`;
const readKey=st.phase.startsWith('read')?st.phase.slice(4):null;if(hint&&readKey){const p=st.points[readKey];svg+=`<path class="horizontal-guide" d="M ${X(p.x)} ${Y(p.y)} H ${X(0)}"/><path class="vertical-guide" d="M ${X(p.x)} ${Y(p.y)} V ${Y(0)}"/>`}
if(['dx','dy','slope','substitute','b','assemble','done'].includes(st.phase)&&st.points.A&&st.points.B){const A=st.points.A,B=st.points.B;svg+=`<path class="pathx" d="M ${X(A.x)} ${Y(A.y)} H ${X(B.x)}"/><path class="pathy" d="M ${X(B.x)} ${Y(A.y)} V ${Y(B.y)}"/>`}
for(const x of domain)for(const y of domain)svg+=`<circle class="dot" cx="${X(x)}" cy="${Y(y)}" r="2"/><circle class="hit" cx="${X(x)}" cy="${Y(y)}" r="18" role="button" tabindex="${canPick?'0':'-1'}" aria-disabled="${!canPick}" aria-label="格子点を選ぶ" data-x="${x}" data-y="${y}"/>`;
for(const key of Object.keys(st.points)){const p=st.points[key];if(key==='I'&&st.points.A&&st.points.A.x===p.x&&st.points.A.y===p.y)continue;svg+=`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="7" fill="${key==='B'?'#a75f0c':'#087766'}" stroke="white" stroke-width="2" pointer-events="none"/><text class="diagram-label" x="${X(p.x)+(p.x>=2?-12:12)}" y="${Y(p.y)+(p.y>=3?20:-12)}" text-anchor="${p.x>=2?'end':'start'}" pointer-events="none">${key==='I'?'交点':key}${st.read[key]?' '+pair(p):''}</text>`}svg+='<text class="tick" x="14" y="389">横 x ・ 縦 y</text></svg>';$('board').innerHTML=svg;document.querySelectorAll('[data-x]').forEach(el=>{const act=()=>{if(canPick)selectPoint(Number(el.dataset.x),Number(el.dataset.y))};el.onclick=act;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act()}}})}
function finish(){st.phase='finished';$('popup').hidden=false;$('popup').className='popup bottom';$('popup').innerHTML='<p class="pop-title">５問できた。</p><button id="again" class="primary">この段階をもう一度</button>';$('again').onclick=start;$('quick-next').hidden=true;$('equation-submit').hidden=true;}

function resetPopupPosition(){popupPosition=null;dragState=null;const host=$('popup');if(host.style)for(const key of ['left','right','top','bottom','width','margin'])host.style.removeProperty(key)}
function popupBounds(){const host=$('popup'),parent=host.parentElement;const w=parent.clientWidth,h=parent.clientHeight;return {host,parent,w,h,maxX:Math.max(8,w-host.offsetWidth-8),maxY:Math.max(8,h-host.offsetHeight-8)}}
function placePopup(){if(!popupPosition||$('popup').hidden)return;const host=$('popup');host.style.width=Math.max(0,Math.min(355,host.parentElement.clientWidth-16))+'px';const b=popupBounds();host.style.left=(8+popupPosition.x*(b.maxX-8))+'px';host.style.top=(8+popupPosition.y*(b.maxY-8))+'px';host.style.right='auto';host.style.bottom='auto';host.style.margin='0'}
function movePopupTo(x,y){const b=popupBounds();popupPosition={x:b.maxX===8?0:Math.max(0,Math.min(1,(x-8)/(b.maxX-8))),y:b.maxY===8?0:Math.max(0,Math.min(1,(y-8)/(b.maxY-8)))};placePopup()}
function attachPopupDrag(){const host=$('popup');host.onpointerdown=e=>{if(!e.target.closest('.pop-title')||e.button!==0)return;const rect=host.getBoundingClientRect(),parent=host.parentElement.getBoundingClientRect();dragState={id:e.pointerId,x:e.clientX,y:e.clientY,left:rect.left-parent.left,top:rect.top-parent.top};host.setPointerCapture(e.pointerId);host.classList.add('dragging');e.preventDefault()};host.onpointermove=e=>{if(!dragState||dragState.id!==e.pointerId)return;movePopupTo(dragState.left+e.clientX-dragState.x,dragState.top+e.clientY-dragState.y);e.preventDefault()};const end=e=>{if(!dragState||dragState.id!==e.pointerId)return;dragState=null;host.classList.remove('dragging');if(host.hasPointerCapture(e.pointerId))host.releasePointerCapture(e.pointerId)};host.onpointerup=end;host.onpointercancel=end;host.onlostpointercapture=()=>{dragState=null;host.classList.remove('dragging')};host.onkeydown=e=>{if(!e.target.closest('.pop-title'))return;const delta={ArrowLeft:[-12,0],ArrowRight:[12,0],ArrowUp:[0,-12],ArrowDown:[0,12]}[e.key];if(!delta)return;e.preventDefault();const r=host.getBoundingClientRect(),p=host.parentElement.getBoundingClientRect();movePopupTo(r.left-p.left+delta[0],r.top-p.top+delta[1])};if(typeof ResizeObserver!=='undefined'){const observer=new ResizeObserver(()=>placePopup());observer.observe(host.parentElement);observer.observe(host)}}

attachPopupDrag();
$('level').onchange=settingsStatus;$('check-coords').onchange=settingsStatus;$('apply').onclick=()=>{start();setSettings(false)};$('equation-form').onsubmit=e=>{e.preventDefault();submitEquation()};$('settings-toggle').onclick=()=>setSettings($('setup').hidden);$('guide-toggle').onclick=()=>{guideOn=!guideOn;renderPopup();updateGuideButton()};$('move-popup').onclick=()=>{popupSide=popupSide==='top'?'bottom':'top';resetPopupPosition();$('popup').className='popup '+popupSide};$('quick-back').onclick=back;$('quick-next').onclick=()=>{if(qi===4)finish();else{qi++;load()}};start();
})();
</script></body></html>
