<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>一次関数「代入＆方程式」マスター</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Zen Maru Gothic & M PLUS Rounded 1c -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Zen Maru Gothic', sans-serif;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      background-color: #f1f5f9;
    }
    .font-num {
      font-family: 'M PLUS Rounded 1c', sans-serif;
    }

    /* 途中計算ステップのカスタムスクロールバー（高さ固定・累積スクロール） */
    .steps-scroll-area {
      scrollbar-width: thin;
      scrollbar-color: rgba(99, 102, 241, 0.6) rgba(15, 23, 42, 0.6);
    }
    .steps-scroll-area::-webkit-scrollbar {
      width: 6px;
    }
    .steps-scroll-area::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
      border-radius: 9999px;
    }
    .steps-scroll-area::-webkit-scrollbar-thumb {
      background: rgba(99, 102, 241, 0.6);
      border-radius: 9999px;
    }

    /* 教科書スタイルの上下分数（スラッシュ / は一切不使用） */
    .math-frac {
      display: inline-flex;
      flex-direction: column;
      vertical-align: middle;
      text-align: center;
      padding: 0 4px;
      font-family: 'M PLUS Rounded 1c', sans-serif;
      font-weight: 800;
      line-height: 1.1;
    }
    .math-frac .num {
      padding-bottom: 2px;
      display: block;
    }
    .math-frac .bar {
      border-top: 2.5px solid currentColor;
      width: 100%;
      min-width: 18px;
      display: block;
      margin: 1px 0;
    }
    .math-frac .den {
      padding-top: 2px;
      display: block;
    }

    /* 1文字ずつのポップ出現アニメーション（0.3秒テンポ用） */
    @keyframes char-pop {
      0% {
        transform: translateY(8px) scale(0.4);
        opacity: 0;
      }
      70% {
        transform: translateY(-2px) scale(1.18);
        opacity: 1;
      }
      100% {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
    }
    .anim-char-pop {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      animation: char-pop 0.22s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    /* 行追加アニメーション */
    @keyframes row-drop {
      0% {
        transform: translateY(-6px) scale(0.97);
        opacity: 0;
      }
      100% {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
    }
    .anim-row-drop {
      animation: row-drop 0.26s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* 両辺への同時追加（ハイライト弾み） */
    @keyframes add-highlight {
      0% {
        transform: scale(0.3);
        opacity: 0;
      }
      70% {
        transform: scale(1.25);
        opacity: 1;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }
    .anim-add-badge {
      animation: add-highlight 0.28s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    /* 右辺の打ち消し消去（赤線が引かれて消滅） */
    @keyframes vanish-cancel {
      0% {
        text-decoration-line: line-through;
        text-decoration-color: #f43f5e;
        text-decoration-thickness: 3px;
        transform: scale(1);
        opacity: 1;
      }
      40% {
        text-decoration-line: line-through;
        text-decoration-color: #f43f5e;
        text-decoration-thickness: 3px;
        transform: scale(1.1);
        opacity: 0.9;
      }
      100% {
        transform: scale(0.1);
        max-width: 0;
        opacity: 0;
        margin: 0;
        padding: 0;
        display: none;
      }
    }
    .anim-vanish {
      animation: vanish-cancel 0.4s ease forwards;
    }

    /* 分母出現アニメーション */
    @keyframes bar-grow {
      0% { transform: scaleX(0); }
      100% { transform: scaleX(1); }
    }
    .anim-bar-grow {
      animation: bar-grow 0.25s ease-out forwards;
    }

    /* 左右入れ替えアニメーション */
    @keyframes swap-flip {
      0% { transform: rotateY(0deg); opacity: 0.5; }
      50% { transform: rotateY(90deg); opacity: 0.2; }
      100% { transform: rotateY(0deg); opacity: 1; }
    }
    .anim-swap {
      animation: swap-flip 0.38s ease-in-out forwards;
    }

    /* スロットの弾みアニメーション */
    @keyframes slot-bounce {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    .anim-bounce {
      animation: slot-bounce 0.32s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .btn-press:active {
      transform: scale(0.93);
    }
    #graphCanvas {
      touch-action: none;
    }
  </style>
</head>

<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col items-center justify-between p-2 sm:p-4">

  <!-- ヘッダー -->
  <header class="w-full max-w-2xl flex items-center justify-between bg-white px-3 sm:px-5 py-2.5 rounded-2xl shadow-sm border border-slate-200">
    <div class="flex items-center gap-2">
      <span class="bg-indigo-600 text-white font-black text-xs px-2.5 py-1 rounded-full shadow-sm">中2数学</span>
      <h1 class="text-sm sm:text-base font-black text-slate-800 tracking-tight">一次関数「代入＆方程式」マスター</h1>
    </div>

    <div class="flex items-center gap-2">
      <button id="soundToggleBtn" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-slate-100 text-slate-700 text-xs font-bold border border-slate-300 hover:bg-slate-200 transition">
        <span id="soundIcon">🔊</span>
        <span id="soundText">音: ON</span>
      </button>
      <button id="resetBtn" class="px-3 py-1.5 rounded-full bg-slate-100 text-slate-700 text-xs font-bold border border-slate-300 hover:bg-rose-50 hover:text-rose-600 transition">
        🔄 リセット
      </button>
    </div>
  </header>

  <main class="w-full max-w-2xl flex flex-col gap-2.5 my-2 flex-1">

    <!-- ① 座標平面グラフエリア (上部) -->
    <div class="bg-white p-3 sm:p-4 rounded-3xl shadow-sm border border-slate-200 flex flex-col items-center">
      <div class="w-full flex items-center justify-between mb-1 px-1">
        <div class="flex items-center gap-1.5">
          <span class="text-xs font-black text-slate-600 uppercase tracking-wider">座標平面グラフ</span>
          <span class="text-[10px] sm:text-xs text-indigo-600 font-bold bg-indigo-50 px-2 py-0.5 rounded-full border border-indigo-200">緑の点をドラッグ可能</span>
        </div>
        <div class="text-xs font-bold font-num text-slate-600">
          グラフの点: (<span id="graphCoordX" class="text-emerald-600 font-extrabold">2</span>, <span id="graphCoordY" class="text-purple-600 font-extrabold">5</span>)
        </div>
      </div>

      <!-- Canvas -->
      <div class="relative w-full aspect-square max-w-[245px] sm:max-w-[270px] bg-slate-50 rounded-2xl border border-slate-200 overflow-hidden cursor-crosshair">
        <canvas id="graphCanvas" class="w-full h-full block"></canvas>
        <div id="dragTooltip" class="absolute pointer-events-none bg-slate-900/95 text-white text-[11px] font-bold font-num px-2 py-1 rounded-md shadow-lg transform -translate-x-1/2 -translate-y-9 opacity-0 transition-opacity">
          (2, 5)
        </div>
      </div>

      <!-- 凡例 -->
      <div class="w-full flex items-center justify-around text-[11px] text-slate-500 mt-2 px-1 border-t border-slate-100 pt-1.5">
        <div class="flex items-center gap-1">
          <span class="w-3 h-0.5 bg-indigo-600 rounded"></span>
          <span>直線 <span class="font-num font-bold">y = ax + b</span></span>
        </div>
        <div class="flex items-center gap-1">
          <span class="w-2.5 h-2.5 rounded-full bg-sky-500"></span>
          <span>切片 b (0, <span id="legendB">1</span>)</span>
        </div>
        <div class="flex items-center gap-1">
          <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
          <span>点 (x, y)</span>
        </div>
      </div>
    </div>

    <!-- ② 途中式・解法ステップ表示エリア (中央: 固定枠・累積スクロール・等式の性質変形) -->
    <div class="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 text-white p-3.5 sm:p-4 rounded-3xl shadow-md flex flex-col justify-between">
      
      <!-- ステップヘッダー部 -->
      <div class="flex items-center justify-between pb-1.5 border-b border-slate-800">
        <div class="flex items-center gap-2">
          <span id="animStepPill" class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
          <span id="animStepTitle" class="text-xs font-bold text-amber-300">等式の性質による変形ステップ</span>
        </div>
        <div class="flex items-center gap-2">
          <span class="text-[10px] text-indigo-300 bg-indigo-950/80 px-2 py-0.5 rounded border border-indigo-700/60 font-medium hidden sm:inline">
            📜 上にスクロールで全式を確認可
          </span>
          <span id="animStatusBadge" class="text-[11px] text-slate-300 bg-slate-800 px-2.5 py-0.5 rounded-full border border-slate-700 font-mono">
            待機中
          </span>
        </div>
      </div>

      <!-- ステップ進行ドットバー -->
      <div id="stepProgressDots" class="flex items-center justify-center gap-1.5 pt-1.5 pb-0.5">
        <span class="step-dot w-2 h-2 rounded-full bg-slate-700 transition-colors" data-step="1"></span>
        <span class="step-dot w-2 h-2 rounded-full bg-slate-700 transition-colors" data-step="2"></span>
        <span class="step-dot w-2 h-2 rounded-full bg-slate-700 transition-colors" data-step="3"></span>
        <span class="step-dot w-2 h-2 rounded-full bg-slate-700 transition-colors" data-step="4"></span>
        <span class="step-dot w-2 h-2 rounded-full bg-slate-700 transition-colors" data-step="5"></span>
        <span class="step-dot w-2 h-2 rounded-full bg-slate-700 transition-colors" data-step="6"></span>
      </div>

      <!-- 過去の式を消さずに下へ累積し、上へ流れるスクロール領域（高さ固定: 約175px） -->
      <div id="stepsContainer" class="steps-scroll-area my-1.5 h-[175px] sm:h-[185px] overflow-y-auto px-2 py-1 flex flex-col gap-2 rounded-xl bg-slate-950/50 border border-slate-800/80 scroll-smooth">
        <!-- JSにより新しいステップ行がここに次々と append されます -->
      </div>

      <!-- アドバイス＆現在座標バー -->
      <div class="text-[11px] text-slate-300 pt-1.5 border-t border-slate-800/80 flex items-center justify-between">
        <span id="coachMessage" class="truncate pr-2">💡 y スロットを選んで数字を代入してみよう！</span>
        <span id="coordBadge" class="text-emerald-300 font-bold font-num whitespace-nowrap">点 (2, 5)</span>
      </div>
    </div>

    <!-- ③ 【基本形 y = ax + b 表示部】数字ボタンのすぐ上（重なりゼロの縦並びカード） -->
    <div class="bg-white p-3 sm:p-4 rounded-3xl shadow-sm border-2 border-indigo-100 flex flex-col gap-2">
      <div class="flex items-center justify-between">
        <span class="text-xs font-bold text-slate-600 flex items-center gap-1">
          <span class="bg-indigo-600 text-white text-[10px] font-black px-1.5 py-0.5 rounded">基本形</span>
          <span>現在の式の値</span>
        </span>
        <span class="text-[11px] text-slate-500 font-medium">👇 タップして代入先を選択</span>
      </div>

      <!-- スロットカード（縦並びFlexboxでラベルと数字を完全に分離） -->
      <div class="flex items-center justify-center gap-1.5 sm:gap-2.5 py-1">

        <!-- [y スロット] -->
        <button id="slot-y" data-var="y" class="var-slot flex-1 max-w-[90px] flex flex-col items-center justify-between p-2 rounded-2xl bg-purple-50/80 border-2 border-purple-300 hover:bg-purple-100 transition shadow-sm cursor-pointer">
          <span class="text-[10px] font-bold text-purple-700 bg-purple-200/80 px-2 py-0.5 rounded-full mb-1">
            y (値)
          </span>
          <span id="val-y" class="text-xl sm:text-2xl font-black font-num text-purple-700 min-h-[1.8rem] flex items-center justify-center">
            5
          </span>
        </button>

        <span class="text-slate-400 font-black text-xl sm:text-2xl select-none">=</span>

        <!-- [a スロット] (傾き) -->
        <button id="slot-a" data-var="a" class="var-slot flex-1 max-w-[90px] flex flex-col items-center justify-between p-2 rounded-2xl bg-rose-50/80 border-2 border-rose-300 hover:bg-rose-100 transition shadow-sm cursor-pointer">
          <span class="text-[10px] font-bold text-rose-700 bg-rose-200/80 px-2 py-0.5 rounded-full mb-1">
            a (傾き)
          </span>
          <span id="val-a" class="text-xl sm:text-2xl font-black font-num text-rose-600 min-h-[1.8rem] flex items-center justify-center">
            2
          </span>
        </button>

        <span class="text-slate-400 font-black text-lg select-none">×</span>

        <!-- [x スロット] (代入中) -->
        <button id="slot-x" data-var="x" class="var-slot flex-1 max-w-[90px] flex flex-col items-center justify-between p-2 rounded-2xl bg-emerald-50 border-2 border-emerald-500 ring-4 ring-emerald-200 hover:bg-emerald-100 transition shadow-sm cursor-pointer">
          <span class="text-[10px] font-bold text-emerald-800 bg-emerald-200 px-2 py-0.5 rounded-full mb-1">
            x (代入中)
          </span>
          <span id="val-x" class="text-xl sm:text-2xl font-black font-num text-emerald-700 min-h-[1.8rem] flex items-center justify-center">
            2
          </span>
        </button>

        <span class="text-slate-400 font-black text-xl sm:text-2xl select-none">+</span>

        <!-- [b スロット] (切片) -->
        <button id="slot-b" data-var="b" class="var-slot flex-1 max-w-[90px] flex flex-col items-center justify-between p-2 rounded-2xl bg-sky-50/80 border-2 border-sky-300 hover:bg-sky-100 transition shadow-sm cursor-pointer">
          <span class="text-[10px] font-bold text-sky-700 bg-sky-200/80 px-2 py-0.5 rounded-full mb-1">
            b (切片)
          </span>
          <span id="val-b" class="text-xl sm:text-2xl font-black font-num text-sky-600 min-h-[1.8rem] flex items-center justify-center">
            1
          </span>
        </button>

      </div>
    </div>

  </main>

  <!-- ④ 画面最下部：数字キーパッド (±、1〜10、0、ランダム) -->
  <section class="w-full max-w-2xl bg-white px-3 py-2.5 sm:py-3 rounded-3xl shadow-sm border border-slate-200">
    <div class="flex items-center justify-between mb-2 px-1">
      <div class="flex items-center gap-2">
        <span class="text-xs font-bold text-slate-500">入力対象:</span>
        <span id="activeSlotBadge" class="bg-emerald-100 text-emerald-800 text-xs font-bold px-2.5 py-0.5 rounded-full border border-emerald-300">
          x に数字を代入する
        </span>
      </div>
      <div class="text-[11px] text-indigo-600 font-bold bg-indigo-50 px-2 py-0.5 rounded-md border border-indigo-200">
        等式の性質アニメーション
      </div>
    </div>

    <div class="flex flex-col gap-2">
      <!-- 符号切り替え & 補助ボタン -->
      <div class="flex items-center gap-1.5 sm:gap-2">
        <div class="flex bg-slate-100 p-1 rounded-2xl border border-slate-200">
          <button id="signPlus" class="sign-btn px-3 sm:px-4 py-1.5 rounded-xl text-xs sm:text-sm font-black transition bg-white shadow-sm text-indigo-600">
            ＋ 正の数
          </button>
          <button id="signMinus" class="sign-btn px-3 sm:px-4 py-1.5 rounded-xl text-xs sm:text-sm font-black transition text-slate-500 hover:text-slate-800">
            ー 負の数
          </button>
        </div>

        <button id="btnZero" class="btn-press flex-1 py-1.5 px-3 bg-slate-100 hover:bg-slate-200 border border-slate-200 text-slate-700 text-xs sm:text-sm font-black rounded-2xl transition">
          0 を代入
        </button>

        <button id="randomBtn" class="btn-press flex-1 py-1.5 px-3 bg-amber-50 hover:bg-amber-100 border border-amber-200 text-amber-700 text-xs sm:text-sm font-black rounded-2xl transition">
          🎲 ランダム
        </button>
      </div>

      <!-- 1〜10 数字ボタン配列 -->
      <div class="grid grid-cols-10 gap-1 sm:gap-1.5">
        <button class="num-btn btn-press py-2.5 rounded-2xl bg-slate-50 hover:bg-indigo-50 active:bg-indigo-600 active:text-white border-2 border-slate-200 hover:border-indigo-400 text-base sm:text-lg font-black font-num text-slate-800 transition shadow-sm" data-val="1">1</button>
        <button class="num-btn btn-press py-2.5 rounded-2xl bg-slate-50 hover:bg-indigo-50 active:bg-indigo-600 active:text-white border-2 border-slate-200 hover:border-indigo-400 text-base sm:text-lg font-black font-num text-slate-800 transition shadow-sm" data-val="2">2</button>
        <button class="num-btn btn-press py-2.5 rounded-2xl bg-slate-50 hover:bg-indigo-50 active:bg-indigo-600 active:text-white border-2 border-slate-200 hover:border-indigo-400 text-base sm:text-lg font-black font-num text-slate-800 transition shadow-sm" data-val="3">3</button>
        <button class="num-btn btn-press py-2.5 rounded-2xl bg-slate-50 hover:bg-indigo-50 active:bg-indigo-600 active:text-white border-2 border-slate-200 hover:border-indigo-400 text-base sm:text-lg font-black font-num text-slate-800 transition shadow-sm" data-val="4">4</button>
        <button class="num-btn btn-press py-2.5 rounded-2xl bg-slate-50 hover:bg-indigo-50 active:bg-indigo-600 active:text-white border-2 border-slate-200 hover:border-indigo-400 text-base sm:text-lg font-black font-num text-slate-800 transition shadow-sm" data-val="5">5</button>
        <button class="num-btn btn-press py-2.5 rounded-2xl bg-slate-50 hover:bg-indigo-50 active:bg-indigo-600 active:text-white border-2 border-slate-200 hover:border-indigo-400 text-base sm:text-lg font-black font-num text-slate-800 transition shadow-sm" data-val="6">6</button>
        <button class="num-btn btn-press py-2.5 rounded-2xl bg-slate-50 hover:bg-indigo-50 active:bg-indigo-600 active:text-white border-2 border-slate-200 hover:border-indigo-400 text-base sm:text-lg font-black font-num text-slate-800 transition shadow-sm" data-val="7">7</button>
        <button class="num-btn btn-press py-2.5 rounded-2xl bg-slate-50 hover:bg-indigo-50 active:bg-indigo-600 active:text-white border-2 border-slate-200 hover:border-indigo-400 text-base sm:text-lg font-black font-num text-slate-800 transition shadow-sm" data-val="8">8</button>
        <button class="num-btn btn-press py-2.5 rounded-2xl bg-slate-50 hover:bg-indigo-50 active:bg-indigo-600 active:text-white border-2 border-slate-200 hover:border-indigo-400 text-base sm:text-lg font-black font-num text-slate-800 transition shadow-sm" data-val="9">9</button>
        <button class="num-btn btn-press py-2.5 rounded-2xl bg-slate-50 hover:bg-indigo-50 active:bg-indigo-600 active:text-white border-2 border-slate-200 hover:border-indigo-400 text-base sm:text-lg font-black font-num text-slate-800 transition shadow-sm" data-val="10">10</button>
      </div>
    </div>
  </section>

  <script>
    /* ==========================================================
       状態管理
       ========================================================== */
    const state = {
      a: 2,               // 傾き (赤)
      b: 1,               // 切片 (青)
      x: 2,               // x の値 (緑)
      y: 5,               // y の値 (紫)
      xFraction: null,    // 割り切れない場合の既約分数表現 { num, den }
      activeTarget: 'x',  // 'x', 'y', 'a', 'b'
      isNegative: false,
      soundEnabled: true,
      currentAnimationId: 0
    };

    // タイミング定数
    const CHAR_INTERVAL = 300; // 1文字ずつ: 0.3秒 (300ms)
    const STEP_WAIT = 1000;    // 改行・複製・両辺変形・分数化など各ステップ間の待機: 1.0秒 (1000ms)

    /* ==========================================================
       Web Audio API によるリアルタイム効果音生成 (iOS/Mac Safari完全対応)
       ========================================================== */
    let audioCtx = null;
    let audioUnlocked = false;

    // ユーザー操作時に即座にAudioContextをアンロック
    function unlockAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      if (audioCtx && !audioUnlocked) {
        // iOS Safari対策: 1サンプルの無音バッファを再生して完全にロック解除
        try {
          const buffer = audioCtx.createBuffer(1, 1, 22050);
          const source = audioCtx.createBufferSource();
          source.buffer = buffer;
          source.connect(audioCtx.destination);
          source.start(0);
          audioUnlocked = true;
        } catch (e) {
          console.warn('Audio unlock warning:', e);
        }
      }
      return audioCtx;
    }

    function playSfx(type) {
      if (!state.soundEnabled) return;
      try {
        const ctx = unlockAudioContext();
        if (!ctx) return;
        const now = ctx.currentTime;

        if (type === 'tap') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(750, now + 0.04);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.05);

        } else if (type === 'char') {
          // 1文字ごとのポコッという出現音
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(659.25, now);
          osc.frequency.exponentialRampToValueAtTime(920, now + 0.05);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.08);

        } else if (type === 'duplicate') {
          // 複製のシュッとした音
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.exponentialRampToValueAtTime(784, now + 0.1);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.12);

        } else if (type === 'addBoth') {
          // 両辺に同時追加のピロリン♪
          [784, 1046.5].forEach((f, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(f, now + i * 0.06);
            gain.gain.setValueAtTime(0.2, now + i * 0.06);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.06 + 0.12);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + i * 0.06);
            osc.stop(now + i * 0.06 + 0.12);
          });

        } else if (type === 'cancel') {
          // 打ち消し消去のシュンッ
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(600, now);
          osc.frequency.exponentialRampToValueAtTime(150, now + 0.15);
          gain.gain.setValueAtTime(0.16, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.16);

        } else if (type === 'fraction') {
          // 横棒と分母の出現音
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(587.33, now);
          osc.frequency.exponentialRampToValueAtTime(987.77, now + 0.12);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.14);

        } else if (type === 'swap') {
          // 左右入れ替えのクルッ音
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.12);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.14);

        } else if (type === 'fanfare') {
          const freqs = [523.25, 659.25, 783.99, 1046.50];
          freqs.forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            const startTime = now + idx * 0.08;
            osc.frequency.setValueAtTime(freq, startTime);
            gain.gain.setValueAtTime(0.2, startTime);
            gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.28);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(startTime);
            osc.stop(startTime + 0.29);
          });

        } else if (type === 'plot') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(880, now);
          osc.frequency.exponentialRampToValueAtTime(392, now + 0.16);
          gain.gain.setValueAtTime(0.22, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.2);
        }
      } catch (err) {
        console.warn('Audio play error:', err);
      }
    }

    // DOM参照

    const COORD_RANGE = 10;
    let canvasWidth = 300;
    let canvasHeight = 300;
    let plotBounceScale = 1;

    function gcd(a, b) {
      a = Math.abs(a);
      b = Math.abs(b);
      while (b) {
        const t = b;
        b = a % b;
        a = t;
      }
      return a;
    }

    // 教科書スタイルの上下分数HTML（スラッシュ / は不使用）
    function createFractionHTML(numContent, denContent, extraClasses = '') {
      return `
        <span class="math-frac ${extraClasses}">
          <span class="num">${numContent}</span>
          <span class="bar anim-bar-grow"></span>
          <span class="den">${denContent}</span>
        </span>
      `;
    }

    function simplifyFraction(num, den) {
      if (den === 0) return { isInteger: true, value: 0, html: '0' };
      if (num === 0) return { isInteger: true, value: 0, html: '0' };

      let sign = 1;
      if ((num < 0 && den > 0) || (num > 0 && den < 0)) sign = -1;
      let n = Math.abs(num);
      let d = Math.abs(den);
      const g = gcd(n, d);
      n = n / g;
      d = d / g;

      if (d === 1) {
        const val = sign * n;
        return { isInteger: true, value: val, html: `${val}` };
      } else {
        const val = (sign * n) / d;
        const prefix = sign < 0 ? '−' : '';
        const fracHtml = `${prefix}${createFractionHTML(n, d)}`;
        return { isInteger: false, value: val, html: fracHtml, num: sign * n, den: d };
      }
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));

    function updateStepIndicator(currentStep) {

    }

    // 1文字・記号ずつ0.3秒おきに出現させるタイピング関数
    async function typeTokensIntoTarget(targetEl, tokens, animId, sfxType = 'char') {
      for (const item of tokens) {
        if (state.currentAnimationId !== animId) return false;

        const span = document.createElement('span');
        span.className = `anim-char-pop ${item.cls || 'text-slate-100 text-lg font-bold'}`;
        if (item.id) span.id = item.id;
        if (item.html) {
          span.innerHTML = item.html;
        } else {
          span.textContent = item.text;
        }
        targetEl.appendChild(span);
        scrollStepsToBottom();

        playSfx(item.sfx || sfxType);
        await sleep(CHAR_INTERVAL); // 0.3秒
      }
      return true;
    }

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvasWidth = rect.width;
      canvasHeight = rect.height;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.resetTransform();
      ctx.scale(dpr, dpr);
      drawGraph();
    }

    function mathToPixel(mx, my) {
      const px = ((mx + COORD_RANGE) / (COORD_RANGE * 2)) * canvasWidth;
      const py = ((COORD_RANGE - my) / (COORD_RANGE * 2)) * canvasHeight;
      return { px, py };
    }

    function pixelToMath(px, py) {
      const mx = (px / canvasWidth) * (COORD_RANGE * 2) - COORD_RANGE;
      const my = COORD_RANGE - (py / canvasHeight) * (COORD_RANGE * 2);
      return {
        mx: Math.round(mx),
        my: Math.round(my)
      };
    }

    function drawGraph() {
      ctx.clearRect(0, 0, canvasWidth, canvasHeight);

      // グリッド線
      ctx.lineWidth = 1;
      ctx.strokeStyle = '#e2e8f0';
      for (let i = -COORD_RANGE; i <= COORD_RANGE; i++) {
        const { px } = mathToPixel(i, 0);
        const { py } = mathToPixel(0, i);
        ctx.beginPath();
        ctx.moveTo(px, 0);
        ctx.lineTo(px, canvasHeight);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, py);
        ctx.lineTo(canvasWidth, py);
        ctx.stroke();
      }

      // x軸・y軸
      const origin = mathToPixel(0, 0);
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#64748b';

      ctx.beginPath();
      ctx.moveTo(0, origin.py);
      ctx.lineTo(canvasWidth, origin.py);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(origin.px, 0);
      ctx.lineTo(origin.px, canvasHeight);
      ctx.stroke();

      // 目盛り
      ctx.fillStyle = '#64748b';
      ctx.font = '10px "M PLUS Rounded 1c", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';

      [-10, -5, 5, 10].forEach(val => {
        const pos = mathToPixel(val, 0);
        ctx.fillText(val, pos.px, origin.py + 4);
      });

      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      [-10, -5, 5, 10].forEach(val => {
        const pos = mathToPixel(0, val);
        ctx.fillText(val, origin.px - 5, pos.py);
      });

      ctx.fillText('O', origin.px - 5, origin.py + 4);
      ctx.font = 'bold 11px "Zen Maru Gothic", sans-serif';
      ctx.fillStyle = '#334155';
      ctx.fillText('x', canvasWidth - 8, origin.py + 12);
      ctx.fillText('y', origin.px - 8, 10);

      // 直線 y = ax + b
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#4f46e5';
      ctx.beginPath();
      const startX = -COORD_RANGE - 2;
      const endX = COORD_RANGE + 2;
      const startY = state.a * startX + state.b;
      const endY = state.a * endX + state.b;

      const pStart = mathToPixel(startX, startY);
      const pEnd = mathToPixel(endX, endY);
      ctx.moveTo(pStart.px, pStart.py);
      ctx.lineTo(pEnd.px, pEnd.py);
      ctx.stroke();

      // 切片 b (0, b)
      if (state.b >= -COORD_RANGE && state.b <= COORD_RANGE) {
        const pIntercept = mathToPixel(0, state.b);
        ctx.beginPath();
        ctx.arc(pIntercept.px, pIntercept.py, 4.5, 0, Math.PI * 2);
        ctx.fillStyle = '#0ea5e9';
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }

      // 点 (x, y) の描画
      const numX = typeof state.x === 'number' ? state.x : (state.xFraction ? state.xFraction.value : 0);
      const numY = state.y;
      const pCurrent = mathToPixel(numX, numY);
      const isVisible = numX >= -COORD_RANGE && numX <= COORD_RANGE && numY >= -COORD_RANGE && numY <= COORD_RANGE;

      if (isVisible) {
        ctx.save();
        ctx.setLineDash([3, 3]);
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = '#10b981';
        ctx.beginPath();
        ctx.moveTo(pCurrent.px, origin.py);
        ctx.lineTo(pCurrent.px, pCurrent.py);
        ctx.lineTo(origin.px, pCurrent.py);
        ctx.stroke();
        ctx.restore();

        const radius = 7.5 * plotBounceScale;
        ctx.beginPath();
        ctx.arc(pCurrent.px, pCurrent.py, radius + 4, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(16, 185, 129, 0.25)';
        ctx.fill();

        ctx.beginPath();
        ctx.arc(pCurrent.px, pCurrent.py, Math.max(radius, 3), 0, Math.PI * 2);
        ctx.fillStyle = '#10b981';
        ctx.fill();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();
      }
    }

    function animatePlotLanding() {
      let start = null;
      plotBounceScale = 0;

      function bounceStep(time) {
        if (!start) start = time;
        const elapsed = time - start;
        const duration = 280;

        if (elapsed < duration) {
          const t = elapsed / duration;
          plotBounceScale = 1 + Math.sin(t * Math.PI) * 0.45;
          drawGraph();
          requestAnimationFrame(bounceStep);
        } else {
          plotBounceScale = 1;
          drawGraph();
        }
      }
      requestAnimationFrame(bounceStep);
    }

    function updateGraphAndCoordinates() {
      const displayX = state.xFraction && !state.xFraction.isInteger
        ? (Math.round(state.xFraction.value * 10) / 10)
        : state.x;
      graphCoordX.textContent = displayX;
      graphCoordY.textContent = state.y;
      legendB.textContent = state.b;

      const badgeXText = state.xFraction && !state.xFraction.isInteger
        ? `${state.xFraction.num}/${state.xFraction.den}`
        : `${state.x}`;
      coordBadge.textContent = `点 (${badgeXText}, ${state.y})`;
      drawGraph();
    }

    /* ==========================================================
       【x を代入した場合】
       1文字0.3秒、各ステップ間に1秒（1000ms）待機
       ========================================================== */
    async function runSubstitutionForX(newX) {
      const animId = ++state.currentAnimationId;
      state.x = newX;
      state.xFraction = null;

      stepsContainer.innerHTML = '';
      valX.textContent = state.x;
      valY.textContent = '？';
      slotX.classList.remove('anim-bounce');
      void slotX.offsetWidth;
      slotX.classList.add('anim-bounce');

      animStatusBadge.textContent = 'x を代入中...';
      animStatusBadge.className = 'text-[11px] text-emerald-300 bg-emerald-950/80 px-2.5 py-0.5 rounded-full border border-emerald-600 font-mono animate-pulse';
      coachMessage.textContent = `💡 ステップ①「x に ${newX} を代入して計算します」`;

      const xDisplay = state.x < 0 ? `(${state.x})` : `${state.x}`;
      const aDisplay = state.a < 0 ? `(${state.a})` : `${state.a}`;
      const bSign = state.b >= 0 ? '+' : '−';
      const bDisplay = Math.abs(state.b).toString();

      updateStepIndicator(1);
      coordBadge.textContent = `x=${state.x} を代入中...`;

      // [行1] 代入式: y = a × x + b (1文字0.3秒)
      const target1 = createStepRow('ステップ① 式に代入 (1文字0.3秒)', 'bg-emerald-950/80 text-emerald-300 border-emerald-600');
      const tokens1 = [
        { text: 'y', cls: 'text-purple-300 text-xl font-bold' },
        { text: '=', cls: 'text-slate-400 text-xl font-black' },
        { text: aDisplay, cls: 'text-rose-300 text-xl font-bold' },
        { text: '×', cls: 'text-slate-400 text-lg font-bold' },
        { text: xDisplay, cls: 'text-emerald-300 text-xl font-black bg-emerald-900/80 px-2 py-0.5 rounded border border-emerald-400 shadow-sm' },
        { text: bSign, cls: 'text-slate-400 text-xl font-black' },
        { text: bDisplay, cls: 'text-sky-300 text-xl font-bold' }
      ];

      const ok1 = await typeTokensIntoTarget(target1, tokens1, animId, 'char');
      if (!ok1) return;

      // 【1秒待機】
      await sleep(STEP_WAIT);
      if (state.currentAnimationId !== animId) return;

      // [行2] 掛け算を先に計算 (1文字0.3秒)
      const multResult = state.a * state.x;
      updateStepIndicator(2);
      coachMessage.textContent = `💡 ステップ②「まず掛け算 (${state.a} × ${state.x} = ${multResult}) を計算！」`;

      const target2 = createStepRow('ステップ② 掛け算を先に計算', 'bg-indigo-950/80 text-indigo-300 border-indigo-600');
      const tokens2 = [
        { text: '=', cls: 'text-slate-400 text-xl font-black' },
        { text: `${multResult}`, cls: 'text-indigo-300 text-xl font-black bg-indigo-900/60 px-2 py-0.5 rounded' },
        { text: bSign, cls: 'text-slate-400 text-xl font-black' },
        { text: bDisplay, cls: 'text-sky-300 text-xl font-bold' }
      ];

      const ok2 = await typeTokensIntoTarget(target2, tokens2, animId, 'char');
      if (!ok2) return;

      // 【1秒待機】
      await sleep(STEP_WAIT);
      if (state.currentAnimationId !== animId) return;

      // [行3] 足し算して答え確定
      state.y = multResult + state.b;
      updateStepIndicator(3);
      coachMessage.textContent = `💡 ステップ③「たし算をして y = ${state.y} が求まりました！」`;

      const target3 = createStepRow('ステップ③ 答え確定！', 'bg-amber-950/80 text-amber-300 border-amber-500');
      const tokens3 = [
        { text: '→', cls: 'text-slate-400 text-xl font-black' },
        { text: 'y', cls: 'text-purple-300 text-2xl font-black' },
        { text: '=', cls: 'text-slate-400 text-2xl font-black' },
        { text: `${state.y}`, cls: 'text-amber-300 text-2xl font-black bg-amber-950/90 px-3 py-0.5 rounded-lg border border-amber-400 shadow-sm' }
      ];

      const ok3 = await typeTokensIntoTarget(target3, tokens3, animId, 'char');
      if (!ok3) return;

      valY.textContent = state.y;
      slotY.classList.remove('anim-bounce');
      void slotY.offsetWidth;
      slotY.classList.add('anim-bounce');
      animStatusBadge.textContent = '計算完了！';
      animStatusBadge.className = 'text-[11px] text-emerald-300 bg-emerald-950/80 px-2.5 py-0.5 rounded-full border border-emerald-600 font-mono';
      playSfx('fanfare');

      // 【1秒待機】
      await sleep(STEP_WAIT);
      if (state.currentAnimationId !== animId) return;

      updateStepIndicator(4);
      updateGraphAndCoordinates();
      playSfx('plot');
      animatePlotLanding();

      const target4 = createStepRow('ステップ④ グラフ反映', 'bg-emerald-950/80 text-emerald-300 border-emerald-600');
      await typeTokensIntoTarget(target4, [
        { text: `📍 グラフ上の点 (${state.x}, ${state.y}) にプロット着地！`, cls: 'text-emerald-300 font-bold text-sm' }
      ], animId, 'char');
    }

    /* ==========================================================
       【y を代入した場合】
       等式の性質に基づくアニメーション（指定タイミング）：
       1. 式 5 = 2x + 1 を1文字0.3秒ずつ表示 【表示後 1秒待機】
       2. その式を下に複製 【複製後 1秒待機】
       3. 複製行の両辺に同時に -1 を追加 【追加後 1秒待機】
       4. 右辺の +1-1 が消えて 5-1=2x だけ残す 【消去後 1秒待機】
       5. その下に 4 = 2x を1文字0.3秒ずつ表示 【表示後 1秒待機】
       6. それを下に複製 【複製後 1秒待機】
       7. 両辺をそれぞれ同時に 1/2（分数横棒＋下に2） 【分数化後 1秒待機】
       8. 1文字0.3秒ずつ 2 = x と表示 【表示後 1秒待機】
       9. 左右入れ替えて x = 2 で完成！【ファンファーレ音】
       10. 1秒待ってグラフの点へ着地アニメーション
       ========================================================== */
    async function runEquationStepsForY(newY) {
      const animId = ++state.currentAnimationId;
      state.y = newY;

      stepsContainer.innerHTML = '';

      valY.textContent = state.y;
      valX.textContent = '？';
      slotY.classList.remove('anim-bounce');
      void slotY.offsetWidth;
      slotY.classList.add('anim-bounce');

      animStatusBadge.textContent = '方程式の解法を開始...';
      animStatusBadge.className = 'text-[11px] text-purple-300 bg-purple-950/80 px-2.5 py-0.5 rounded-full border border-purple-600 font-mono animate-pulse';

      if (state.a === 0) {
        const errTarget = createStepRow('エラー', 'bg-rose-950/80 text-rose-300 border-rose-600');
        await typeTokensIntoTarget(errTarget, [
          { text: `${state.y} = 0x + ${state.b} (a=0のため解が1つに決まりません)`, cls: 'text-rose-400 font-bold text-sm' }
        ], animId);
        return;
      }

      coachMessage.textContent = `💡 ①「y に ${newY} を代入して方程式をつくります！」`;
      coordBadge.textContent = `y=${state.y} から x を逆算中...`;
      updateStepIndicator(1);

      const bSign = state.b >= 0 ? '+' : '−';
      const bAbs = Math.abs(state.b).toString();
      const aDisplay = state.a === 1 ? '' : (state.a === -1 ? '−' : `${state.a}`);

      // -------------------------------------------------------------
      // ① 「5 = 2x + 1」を1文字ずつ0.3秒おきに表示
      // -------------------------------------------------------------
      const target1 = createStepRow('① 式に代入 (1文字0.3秒)', 'bg-purple-950/80 text-purple-300 border-purple-600');
      const tokens1 = [
        { text: `${state.y}`, cls: 'text-purple-300 text-xl font-black bg-purple-900/80 px-2 py-0.5 rounded border border-purple-400 shadow-sm' },
        { text: '=', cls: 'text-slate-400 text-xl font-black' },
        { text: `${aDisplay}`, cls: 'text-rose-300 text-xl font-bold' },
        { text: 'x', cls: 'text-emerald-400 text-xl font-black' }
      ];

      if (state.b !== 0) {
        tokens1.push({ text: bSign, cls: 'text-slate-400 text-xl font-black' });
        tokens1.push({ text: bAbs, cls: 'text-sky-300 text-xl font-bold' });
      }

      const ok1 = await typeTokensIntoTarget(target1, tokens1, animId, 'char');
      if (!ok1) return;

      // 【表示し終えたあと 1秒待機】
      await sleep(STEP_WAIT);
      if (state.currentAnimationId !== animId) return;

      // 切片 b がある場合の等式の性質（両辺から引く・足す）
      if (state.b !== 0) {
        // -------------------------------------------------------------
        // ② 1秒後に、その式を下に「複製」
        // -------------------------------------------------------------
        playSfx('duplicate');
        const target2 = createStepRow('② 式を複製 → 両辺から同じ数を引く準備', 'bg-indigo-950/80 text-indigo-300 border-indigo-600');

        target2.innerHTML = `
          <span class="text-purple-300 text-xl font-bold">${state.y}</span>
          <span class="text-slate-400 text-xl font-black">=</span>
          <span class="text-rose-300 text-xl font-bold">${aDisplay}</span>
          <span class="text-emerald-400 text-xl font-black">x</span>
          <span id="rightBSign" class="text-slate-400 text-xl font-black">${bSign}</span>
          <span id="rightBVal" class="text-sky-300 text-xl font-bold">${bAbs}</span>
        `;
        scrollStepsToBottom();

        // 【複製後 1秒待機】
        await sleep(STEP_WAIT);
        if (state.currentAnimationId !== animId) return;

        // -------------------------------------------------------------
        // ③ さらに1秒後、その複製行の両辺に「同時に -1 を追加」
        // -------------------------------------------------------------
        updateStepIndicator(2);
        const subSign = state.b >= 0 ? '−' : '+';
        coachMessage.textContent = `💡 ③「等式の性質：両辺に同時に ${subSign}${bAbs} を追加します！」`;
        playSfx('addBoth');

        // 左辺の y の直後に -1 バッジを挿入
        const leftYSpan = target2.children[0];
        const leftAddedBadge = document.createElement('span');
        leftAddedBadge.className = 'anim-add-badge text-amber-300 text-xl font-black bg-amber-900/90 px-2 py-0.5 rounded border border-amber-400 shadow-sm';
        leftAddedBadge.textContent = `${subSign}${bAbs}`;
        leftYSpan.after(leftAddedBadge);

        // 右辺の末尾に -1 バッジを追加
        const rightAddedBadge = document.createElement('span');
        rightAddedBadge.id = 'rightAddedPart';
        rightAddedBadge.className = 'anim-add-badge text-amber-300 text-xl font-black bg-amber-900/90 px-2 py-0.5 rounded border border-amber-400 shadow-sm';
        rightAddedBadge.textContent = `${subSign}${bAbs}`;
        target2.appendChild(rightAddedBadge);
        scrollStepsToBottom();

        // 【追加後 1秒待機】
        await sleep(STEP_WAIT);
        if (state.currentAnimationId !== animId) return;

        // -------------------------------------------------------------
        // ④ その1秒後に、右辺の「+1-1」が消えて「5-1=2x」だけ残す
        // -------------------------------------------------------------
        coachMessage.textContent = `💡 ④「右辺の ${bSign}${bAbs} と ${subSign}${bAbs} は打ち消し合って 0 になるので消えます！」`;
        playSfx('cancel');

        const rightBSign = target2.querySelector('#rightBSign');
        const rightBVal = target2.querySelector('#rightBVal');
        const rightAdded = target2.querySelector('#rightAddedPart');

        if (rightBSign) rightBSign.classList.add('anim-vanish');
        if (rightBVal) rightBVal.classList.add('anim-vanish');
        if (rightAdded) rightAdded.classList.add('anim-vanish');

        // アニメーション完了後にDOMから完全除去して「5 - 1 = 2x」だけ残す
        await sleep(260);
        if (rightBSign && rightBSign.parentNode) rightBSign.remove();
        if (rightBVal && rightBVal.parentNode) rightBVal.remove();
        if (rightAdded && rightAdded.parentNode) rightAdded.remove();
        scrollStepsToBottom();

        // 【消去後 1秒待機】
        await sleep(STEP_WAIT);
        if (state.currentAnimationId !== animId) return;
      }

      // -------------------------------------------------------------
      // ⑤ 改行して、その下に「4 = 2x」の式を1文字ずつ0.3秒おきに表示
      // -------------------------------------------------------------
      updateStepIndicator(3);
      const calculatedLeft = state.y - state.b;
      coachMessage.textContent = `💡 ⑤「左辺を計算して ${calculatedLeft} = ${aDisplay}x になります」`;

      const target3 = createStepRow(`⑤ 左辺を計算 (${state.y} ${state.b >= 0 ? '−' : '+'} ${bAbs} = ${calculatedLeft})`, 'bg-indigo-950/80 text-indigo-300 border-indigo-600');
      const tokens3 = [
        { text: `${calculatedLeft}`, cls: 'text-indigo-200 text-xl font-black bg-indigo-950/90 px-2 py-0.5 rounded border border-indigo-500' },
        { text: '=', cls: 'text-slate-400 text-xl font-black' },
        { text: `${aDisplay}`, cls: 'text-rose-300 text-xl font-bold' },
        { text: 'x', cls: 'text-emerald-400 text-xl font-black' }
      ];

      const ok3 = await typeTokensIntoTarget(target3, tokens3, animId, 'char');
      if (!ok3) return;

      // 【4 = 2x を表示し終えたあと 1秒待機】
      await sleep(STEP_WAIT);
      if (state.currentAnimationId !== animId) return;

      // -------------------------------------------------------------
      // ⑥ それを下に複製
      // -------------------------------------------------------------
      playSfx('duplicate');
      const target4 = createStepRow(`⑥ 式を複製 → 両辺を ${state.a} で割る準備`, 'bg-sky-950/80 text-sky-300 border-sky-600');

      target4.innerHTML = `
        <span id="fracLeftNum" class="text-indigo-200 text-xl font-black">${calculatedLeft}</span>
        <span class="text-slate-400 text-xl font-black">=</span>
        <span id="fracRightNum" class="text-emerald-300 text-xl font-bold">${aDisplay}x</span>
      `;
      scrollStepsToBottom();

      // 【複製後 1秒待機】
      await sleep(STEP_WAIT);
      if (state.currentAnimationId !== animId) return;

      // -------------------------------------------------------------
      // ⑦ さらに1秒後、両辺をそれぞれ同時に 1/2（横棒を引いて下に2を表示）
      // -------------------------------------------------------------
      updateStepIndicator(4);
      coachMessage.textContent = `💡 ⑦「等式の性質：両辺を同時に x の係数 (${state.a}) で割ります！」`;
      playSfx('fraction');

      // 教科書スタイルの上下分数に瞬時に置換
      const leftFracHtml = createFractionHTML(
        `<span class="text-indigo-200">${calculatedLeft}</span>`,
        `<span class="text-rose-300">${state.a}</span>`,
        'text-xl text-slate-100 bg-slate-950/80 px-2.5 py-1 rounded-xl border border-indigo-500/60 shadow-sm'
      );
      const rightFracHtml = createFractionHTML(
        `<span class="text-emerald-300">${aDisplay}x</span>`,
        `<span class="text-rose-300">${state.a}</span>`,
        'text-xl text-slate-100 bg-slate-950/80 px-2.5 py-1 rounded-xl border border-indigo-500/60 shadow-sm'
      );

      target4.innerHTML = `
        ${leftFracHtml}
        <span class="text-slate-300 text-2xl font-black">=</span>
        ${rightFracHtml}
      `;
      scrollStepsToBottom();

      // 【分数化後 1秒待機】
      await sleep(STEP_WAIT);
      if (state.currentAnimationId !== animId) return;

      // -------------------------------------------------------------
      // ⑧ 改行して、1文字0.3秒ずつ「2 = x」と表示
      // -------------------------------------------------------------
      updateStepIndicator(5);
      const fractionResult = simplifyFraction(calculatedLeft, state.a);
      state.xFraction = fractionResult;
      state.x = fractionResult.value;

      coachMessage.textContent = `💡 ⑧「約分して解を求めます！」`;

      const target5 = createStepRow('⑧ 約分して計算 (1文字0.3秒)', 'bg-indigo-950/80 text-indigo-300 border-indigo-600');
      const tokens5 = [];

      if (fractionResult.isInteger) {
        tokens5.push({ text: `${fractionResult.value}`, cls: 'text-amber-300 text-2xl font-black bg-amber-950/90 px-2.5 py-0.5 rounded border border-amber-400' });
      } else {
        tokens5.push({ html: fractionResult.html, cls: 'text-amber-300 text-2xl font-black bg-amber-950/90 px-2.5 py-0.5 rounded border border-amber-400' });
      }

      tokens5.push({ text: '=', cls: 'text-slate-400 text-2xl font-black' });
      tokens5.push({ text: 'x', cls: 'text-emerald-400 text-2xl font-black' });

      const ok5 = await typeTokensIntoTarget(target5, tokens5, animId, 'char');
      if (!ok5) return;

      // 【2 = x 表示後 1秒待機】
      await sleep(STEP_WAIT);
      if (state.currentAnimationId !== animId) return;

      // -------------------------------------------------------------
      // ⑨ それを左右入れ替えて「x = 2」にして完成！
      // -------------------------------------------------------------
      updateStepIndicator(6);
      coachMessage.textContent = `💡 ⑨「左右を入れ替えて x = ${fractionResult.isInteger ? fractionResult.value : ''} の形にして完成！」`;
      playSfx('swap');

      const target6 = createStepRow('⑨ 左右を入れ替えて完成！', 'bg-amber-950/80 text-amber-300 border-amber-500');
      target6.classList.add('anim-swap');

      const valHtml = fractionResult.isInteger ? `${fractionResult.value}` : fractionResult.html;
      target6.innerHTML = `
        <span class="text-emerald-400 text-2xl font-black">x</span>
        <span class="text-slate-300 text-2xl font-black">=</span>
        <span class="text-amber-300 text-2xl font-black bg-amber-950/90 px-3 py-0.5 rounded-lg border border-amber-400 shadow-md">${valHtml}</span>
      `;
      scrollStepsToBottom();

      // 基本形スロットの x を更新して跳ねる
      valX.innerHTML = valHtml;
      slotX.classList.remove('anim-bounce');
      void slotX.offsetWidth;
      slotX.classList.add('anim-bounce');

      animStatusBadge.textContent = '解が完成！';
      animStatusBadge.className = 'text-[11px] text-emerald-300 bg-emerald-950/80 px-2.5 py-0.5 rounded-full border border-emerald-600 font-mono';
      playSfx('fanfare');

      // 【完成後 1秒待機してグラフへ反映】
      await sleep(STEP_WAIT);
      if (state.currentAnimationId !== animId) return;

      updateGraphAndCoordinates();
      playSfx('plot');
      animatePlotLanding();

      const displayCoordX = state.xFraction && !state.xFraction.isInteger
        ? `${state.xFraction.num}/${state.xFraction.den}`
        : `${state.x}`;

      const target7 = createStepRow('⑩ グラフ反映', 'bg-emerald-950/80 text-emerald-300 border-emerald-600');
      await typeTokensIntoTarget(target7, [
        { text: `📍 グラフ上の点 (${displayCoordX}, ${state.y}) にプロット着地！`, cls: 'text-emerald-300 font-bold text-sm' }
      ], animId, 'char');
    }

    function updateParameters() {
      valA.textContent = state.a;
      valB.textContent = state.b;
      state.xFraction = null;
      state.y = state.a * state.x + state.b;
      valY.textContent = state.y;
      valX.textContent = state.x;

      updateGraphAndCoordinates();
      playSfx('tap');

      stepsContainer.innerHTML = '';
      const target = createStepRow('式の更新', 'bg-indigo-950/80 text-indigo-300 border-indigo-600');
      const bSign = state.b >= 0 ? '+' : '−';
      target.innerHTML = `<span class="text-indigo-200 font-bold">式が更新されました: y = ${state.a}x ${bSign} ${Math.abs(state.b)}</span>`;
      updateStepIndicator(0);
    }

    function setActiveTarget(target) {
      state.activeTarget = target;
      playSfx('tap');

      Object.keys(slots).forEach(key => {
        slots[key].classList.remove('ring-4', 'ring-emerald-300', 'ring-purple-300', 'ring-rose-300', 'ring-sky-300', 'border-emerald-500', 'border-purple-500', 'border-rose-500', 'border-sky-500');
        slots[key].classList.add(
          key === 'x' ? 'border-emerald-300' :
          key === 'y' ? 'border-purple-300' :
          key === 'a' ? 'border-rose-300' : 'border-sky-300'
        );
      });

      if (target === 'x') {
        slots.x.classList.remove('border-emerald-300');
        slots.x.classList.add('ring-4', 'ring-emerald-300', 'border-emerald-500');
        activeSlotBadge.textContent = 'x に数字を代入する';
        activeSlotBadge.className = 'bg-emerald-100 text-emerald-800 text-xs font-bold px-2.5 py-0.5 rounded-full border border-emerald-300';
      } else if (target === 'y') {
        slots.y.classList.remove('border-purple-300');
        slots.y.classList.add('ring-4', 'ring-purple-300', 'border-purple-500');
        activeSlotBadge.textContent = 'y に代入 (等式の性質で解く)';
        activeSlotBadge.className = 'bg-purple-100 text-purple-800 text-xs font-bold px-2.5 py-0.5 rounded-full border border-purple-300';
      } else if (target === 'a') {
        slots.a.classList.remove('border-rose-300');
        slots.a.classList.add('ring-4', 'ring-rose-300', 'border-rose-500');
        activeSlotBadge.textContent = 'a (傾き) を変更する';
        activeSlotBadge.className = 'bg-rose-100 text-rose-800 text-xs font-bold px-2.5 py-0.5 rounded-full border border-rose-300';
      } else if (target === 'b') {
        slots.b.classList.remove('border-sky-300');
        slots.b.classList.add('ring-4', 'ring-sky-300', 'border-sky-500');
        activeSlotBadge.textContent = 'b (切片) を変更する';
        activeSlotBadge.className = 'bg-sky-100 text-sky-800 text-xs font-bold px-2.5 py-0.5 rounded-full border border-sky-300';
      }
    }

    Object.keys(slots).forEach(key => {
      slots[key].addEventListener('click', () => {
        unlockAudioContext();
        setActiveTarget(key);
      });
    });

    // 符号切り替えボタン
    signPlus.addEventListener('click', () => {
      unlockAudioContext();
      state.isNegative = false;
      signPlus.className = 'sign-btn px-3 sm:px-4 py-1.5 rounded-xl text-xs sm:text-sm font-black transition bg-white shadow-sm text-indigo-600';
      signMinus.className = 'sign-btn px-3 sm:px-4 py-1.5 rounded-xl text-xs sm:text-sm font-black transition text-slate-500 hover:text-slate-800';
      playSfx('tap');
    });

    signMinus.addEventListener('click', () => {
      unlockAudioContext();
      state.isNegative = true;
      signMinus.className = 'sign-btn px-3 sm:px-4 py-1.5 rounded-xl text-xs sm:text-sm font-black transition bg-rose-500 text-white shadow-sm';
      signPlus.className = 'sign-btn px-3 sm:px-4 py-1.5 rounded-xl text-xs sm:text-sm font-black transition text-slate-500 hover:text-slate-800';
      playSfx('tap');
    });

    btnZero.addEventListener('click', () => {
      unlockAudioContext();
      handleNumberInput(0);
    });

    document.querySelectorAll('.num-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        unlockAudioContext();
        const baseNum = parseInt(btn.getAttribute('data-val'), 10);
        const inputNum = state.isNegative ? -baseNum : baseNum;
        handleNumberInput(inputNum);
      });
    });

    function handleNumberInput(num) {
      if (state.activeTarget === 'x') {
        runSubstitutionForX(num);
      } else if (state.activeTarget === 'y') {
        runEquationStepsForY(num);
      } else if (state.activeTarget === 'a') {
        state.a = num;
        updateParameters();
      } else if (state.activeTarget === 'b') {
        state.b = num;
        updateParameters();
      }
    }

    randomBtn.addEventListener('click', () => {
      unlockAudioContext();
      if (state.activeTarget === 'y') {
        const sampleYs = [-7, -5, -3, -1, 1, 3, 5, 7, 9];
        const randY = sampleYs[Math.floor(Math.random() * sampleYs.length)];
        state.isNegative = randY < 0;
        if (state.isNegative) signMinus.click(); else signPlus.click();
        runEquationStepsForY(randY);
      } else {
        const randX = Math.floor(Math.random() * 9) - 4; // -4 〜 4
        state.isNegative = randX < 0;
        if (state.isNegative) signMinus.click(); else signPlus.click();
        setActiveTarget('x');
        runSubstitutionForX(randX);
      }
    });

    resetBtn.addEventListener('click', () => {
      unlockAudioContext();
      state.a = 2;
      state.b = 1;
      state.isNegative = false;
      signPlus.click();
      setActiveTarget('x');
      updateParameters();
      runSubstitutionForX(2);
    });

    soundToggleBtn.addEventListener('click', () => {
      state.soundEnabled = !state.soundEnabled;
      if (state.soundEnabled) {
        soundIcon.textContent = '🔊';
        soundText.textContent = '音: ON';
        soundToggleBtn.className = 'flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-slate-100 text-slate-700 text-xs font-bold border border-slate-300 hover:bg-slate-200 transition';
        unlockAudioContext();
        playSfx('tap');
      } else {
        soundIcon.textContent = '🔇';
        soundText.textContent = '音: OFF';
        soundToggleBtn.className = 'flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-rose-50 text-rose-600 text-xs font-bold border border-rose-300 transition';
      }
    });

    let isDragging = false;

    function getCanvasCoordinates(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        px: e.clientX - rect.left,
        py: e.clientY - rect.top
      };
    }

    function checkHitCurrentPoint(px, py) {
      const numX = typeof state.x === 'number' ? state.x : (state.xFraction ? state.xFraction.value : 0);
      const pCurrent = mathToPixel(numX, state.y);
      const dist = Math.hypot(px - pCurrent.px, py - pCurrent.py);
      return dist <= 32;
    }

    function updateTooltip(px, py, text) {
      dragTooltip.style.left = `${px}px`;
      dragTooltip.style.top = `${py}px`;
      dragTooltip.textContent = text;
      dragTooltip.style.opacity = '1';
    }

    canvas.addEventListener('pointerdown', (e) => {
      unlockAudioContext();
      const { px, py } = getCanvasCoordinates(e);

      if (checkHitCurrentPoint(px, py)) {
        isDragging = true;
        canvas.setPointerCapture(e.pointerId);
        updateTooltip(px, py, `(${state.x}, ${state.y})`);
        playSfx('tap');
      } else {
        const { mx } = pixelToMath(px, py);
        if (mx >= -10 && mx <= 10) {
          setActiveTarget('x');
          state.isNegative = mx < 0;
          if (state.isNegative) signMinus.click(); else signPlus.click();
          runSubstitutionForX(mx);
        }
      }
    });

    canvas.addEventListener('pointermove', (e) => {
      const { px, py } = getCanvasCoordinates(e);

      if (isDragging) {
        const { mx } = pixelToMath(px, py);
        const clampedX = Math.max(-10, Math.min(10, mx));

        if (clampedX !== state.x) {
          state.x = clampedX;
          state.xFraction = null;
          state.y = state.a * state.x + state.b;

          valX.textContent = state.x;
          valY.textContent = state.y;
          graphCoordX.textContent = state.x;
          graphCoordY.textContent = state.y;
          coordBadge.textContent = `点 (${state.x}, ${state.y})`;

          drawGraph();
          playSfx('char');
        }

        const pCurrent = mathToPixel(state.x, state.y);
        updateTooltip(pCurrent.px, pCurrent.py, `x=${state.x} → y=${state.y}`);
      } else {
        if (checkHitCurrentPoint(px, py)) {
          canvas.style.cursor = 'grab';
        } else {
          canvas.style.cursor = 'crosshair';
        }
      }
    });

    function finishDrag(e) {
      if (isDragging) {
        isDragging = false;
        try {
          canvas.releasePointerCapture(e.pointerId);
        } catch (err) {}
        dragTooltip.style.opacity = '0';
        playSfx('fanfare');
        runSubstitutionForX(state.x);
      }
    }

    canvas.addEventListener('pointerup', finishDrag);
    canvas.addEventListener('pointercancel', finishDrag);

    // 画面初期化とイベント登録
    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('DOMContentLoaded', () => {
      resizeCanvas();
      setActiveTarget('x');
      runSubstitutionForX(2);
    });

    // ユーザーの最初の操作で即座にアンロック
    document.addEventListener('pointerdown', unlockAudioContext, { once: true });
    document.addEventListener('touchstart', unlockAudioContext, { once: true });
    document.addEventListener('click', unlockAudioContext, { once: true });
  </script>
</body>
</html>
