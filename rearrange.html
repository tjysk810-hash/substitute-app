</main><script>(()=>{'use strict';
const $=id=>document.getElementById(id),n=v=>String(v).replace('-','−');

const tail=c=>c===0?'':c<0?' − '+f(-c):' + '+f(c);
const pretty=(a,b)=>'y = '+(a===0?'0':Number.isInteger(a)?term(a,'x'):'('+f(a)+')x')+tail(b);
const banks={1:[[2,1,5],[3,1,6],[-2,1,3],[1,1,0],[-3,1,-2]],2:[[2,3,6],[4,2,8],[-3,2,4],[1,2,-3],[3,4,0]],3:[[2,-1,5],[3,-1,-2],[2,-2,6],[-3,-2,4],[1,-3,-6]],4:[[2,3,6,'reverse'],[-2,1,3,'yx'],[3,-2,4,'reverse'],[4,2,-6,'yx'],[1,-1,0,'reverse']]};

function flipSign(id){const value=$(id).value.normalize('NFKC').trim().replace(/−/g,'-');$(id).value=value.startsWith('-')?value.slice(1):'-'+value.replace(/^\+/,'');updateSign(id)}

function settings(open){$('setup').hidden=!open;$('settings-toggle').textContent=open?'≪':'≫';$('settings-toggle').setAttribute('aria-expanded',String(open))}
function status(){$('status').textContent=($('level').value!==level?'変更はまだ反映されていません。 ':'')+`現在：段階${level}。始めると問題と記録をリセットします。`}

function save(){stack.push({phase,flipped,solved,history:[...history],draftA,draftB})}

function division(){const d=q().y;return `${term(d,'y')} ÷ ${operand(d)} = (${term(-q().x,'x')}) ÷ ${operand(d)} ${q().c<0?'−':'+'} ${f(Math.abs(q().c))} ÷ ${operand(d)}`}
function formula(){const v=q();if(phase==='flip')return expressionQ(v);if(phase==='pick'||phase==='operation')return expressionQ(v,true);if(phase==='cancel'){const left=expressionQ(v,true).split(' = ')[0],op=v.x>0?' − ':' + ';return left+`<span class="newop">${op}${term(Math.abs(v.x),'x')}</span> = ${n(v.c)}<span class="newop">${op}${term(Math.abs(v.x),'x')}</span>`}if(phase==='divisor')return reduced();if(phase==='divide')return division();if(phase==='calcA'&&v.y===1)return reduced();if(phase==='calcA')return `y = <span class="fraction-display"><span>${term(-v.x,'x')}</span><span>${n(v.y)}</span></span> + <span class="fraction-display"><span>${n(v.c)}</span><span>${n(v.y)}</span></span>`;if(phase==='calcB'&&v.y===1)return pretty(slope(),cut());if(phase==='calcB')return `y = (${f(slope())})x + <span class="fraction-display"><span>${n(v.c)}</span><span>${n(v.y)}</span></span>`;return pretty(slope(),cut())}
function prompt(){const v=q();return {flip:['まず、yのある側を左にしよう。','左右をそっくり入れ替える。符号は変えない。'],pick:['yの隣の、どの項をなくしたい？','式の中の項を押そう。yの項は残す。'],operation:[`${term(v.x,'x')} をなくすには？`,'両辺に同じ操作をする。'],cancel:['両辺に同じ操作をした。','左側のxの項が打ち消し合う。右側も整理しよう。'],divisor:['yにかかっている数は？','両辺を、その数で割るとyだけが残る。マイナスも含めて答える。'],divide:['右辺のすべての項を割る。','xの項も、残りの数も、同じ数で割る。'],calcA:['xにかかる数を求めよう。',`${f(-v.x)} ÷ ${operand(v.y)} =`],calcB:['残りの数を求めよう。',`${n(v.c)} ÷ ${operand(v.y)} =`],assemble:['yだけを左に残せた。','下の完成形を確認して「この形で確定」を押そう。'],done:['完成。この形なら傾きと切片が読める。','元の式と同じ関係を表している。']}[phase]}
function render(){statView();$('counter').textContent=`⑤ · 段階${level} · ${qi+1}/5`;$('original').textContent='もとの式：'+expressionQ(q());$('math').innerHTML=formula();$('math').className='math-stage'+(phase==='divide'?' division-row':'');$('feedback').hidden=true;mountField('a',draftA);mountField('b',draftB);$('back').disabled=!stack.length;$('submit-equation').hidden=solved;$('next').hidden=!solved;$('next').textContent=qi===4?'５問終了':'次の問題';['a','a-den','a-sign','a-fraction','b','b-den','b-sign','b-fraction'].forEach(id=>$(id).disabled=solved);$('guide-toggle').textContent='誘導 '+(guideOn?'ON':'OFF');$('guide-toggle').setAttribute('aria-pressed',String(guideOn));$('history').innerHTML='<ol class="formula-history"><li>'+expressionQ(q())+'</li>'+history.map(t=>'<li>'+t+'</li>').join('')+'</ol>';
if(!guideOn&&!solved){$('math').textContent=expressionQ(q());$('lesson').innerHTML='<p class="small">下の欄に、y＝の形を直接入力しよう。</p>';return}
const[title,desc]=prompt();let body=`<h2 class="instruction">${title}</h2><p class="subinstruction">${desc}</p>`;
if(phase==='pick'){const v=q(),x=`<button id="term-x" class="term" aria-label="${n(v.x)}xの項">${term(v.x,'x')}</button>`,y=`<button id="term-y" class="term" aria-label="${n(v.y)}yの項">${term(v.y,'y')}</button>`,c=`<button id="term-c" class="term">${n(v.c)}</button>`;$('math').innerHTML=(v.order==='yx'?y+(v.x>0?' ＋ ':' ')+x:x+(v.y>0?' ＋ ':' ')+y)+' = '+c}
if(phase==='operation')body+='<div class="options"><button id="subtract">両辺から '+term(Math.abs(q().x),'x')+' を引く</button><button id="add">両辺に '+term(Math.abs(q().x),'x')+' を足す</button></div>';
if(['flip','cancel','divide'].includes(phase))body+=`<button id="advance-step" class="primary">${phase==='flip'?'左右を入れ替える':phase==='cancel'?'同じ項をまとめる':'１つずつ計算する'}</button>`;
if(['divisor','calcA','calcB'].includes(phase))body+='<form id="number-form" class="number-form"><span id="field-number"></span><button type="submit" class="primary">確定</button></form>';
if(phase==='done')body+=`<div class="term-labels"><span>傾き<br><strong>${f(slope())}</strong></span><span>切片<br><strong>${f(cut())}</strong></span></div>`;
$('lesson').innerHTML=body;
if(phase==='pick'){$('term-x').onclick=()=>chooseTerm('x');$('term-y').onclick=()=>chooseTerm('y');$('term-c').onclick=()=>chooseTerm('c')}
if(phase==='operation'){$('subtract').onclick=()=>operate('subtract');$('add').onclick=()=>operate('add')}
if(['flip','cancel','divide'].includes(phase))$('advance-step').onclick=advanceStep;
if(['divisor','calcA','calcB'].includes(phase)){mountField('number','');$('number-form').onsubmit=e=>{e.preventDefault();submitNumber(fieldValue('number'))}}}
function chooseTerm(v){if(phase!=='pick')return;if(v!=='x'){stats[0]++;statView();message('左側にはyの項を残したい。xの項を選ぼう。',true);return}move('operation')}
function operate(op){if(phase!=='operation')return;const correct=q().x>0?'subtract':'add';if(op!==correct){stats[1]++;statView();message(`${term(q().x,'x')} と打ち消し合うように、反対の符号の項を足す。`,true);return}move('cancel')}
function advanceStep(){if(phase==='flip'){save();flipped=true;history.push(expressionQ(q(),true));phase='pick';render()}else if(phase==='cancel')move(q().y===1?'calcA':'divisor',reduced());else if(phase==='divide')move('calcA',division())}
function expected(){return phase==='divisor'?q().y:phase==='calcA'?slope():phase==='calcB'?cut():null}
function submitNumber(raw){const want=expected();if(want===null)return;const value=parse(raw);if(value===null){message('数字を入力しよう。分数は「分数 ON」で分子・分母を分けて入力できる。',true);return}if(!near(value,want)){stats[phase==='divisor'?2:3]++;statView();message(phase==='divisor'?'yの前の数を、符号も含めて見よう。':'符号と割る数を確かめて、もう一度計算しよう。',true);return}save();if(phase==='divisor')phase='divide';else if(phase==='calcA'){draftA=f(value);phase='calcB'}else{draftB=f(value);history.push(pretty(slope(),cut()));phase='assemble'}render()}
function submitEquation(){if(solved)return;draftA=fieldValue('a');draftB=fieldValue('b');const a=parse(draftA),b=parse(draftB);if(a===null||b===null){message('２つの欄に数字を入れよう。残りの数がないときは０。',true);return}if(!near(a,slope())||!near(b,cut())){stats[4]++;statView();message('まだ同じ関係の式になっていません。両辺への操作と、すべての項を割ったかを確認しよう。',true);return}save();solved=true;phase='done';draftA=f(a);draftB=f(b);if(history.at(-1)!==pretty(a,b))history.push(pretty(a,b));render();message('正解。y＝の形にできた。')}
function load(){phase=q().order==='reverse'?'flip':'pick';flipped=false;solved=false;stack=[];history=[];draftA='';draftB='';render()}
function start(){level=$('level').value;questions=banks[level].map(([x,y,c,order='xy'])=>({x,y,c,order}));qi=0;stats=[0,0,0,0,0];guideOn=true;load();status()}
function next(){if(!solved)return;if(qi<4){qi++;load();return}$('lesson').innerHTML='<div class="result"><h2>５問できた。</h2><p>両辺に同じ操作をする。割るときは、すべての項を割る。</p><button id="again" class="primary">この段階をもう一度</button></div>';$('again').onclick=start;$('next').hidden=true}
$('settings-toggle').onclick=()=>settings($('setup').hidden);$('level').onchange=status;$('apply').onclick=()=>{start();settings(false)};$('guide-toggle').onclick=()=>{guideOn=!guideOn;render()};$('back').onclick=back;$('next').onclick=next;$('equation-form').onsubmit=e=>{e.preventDefault();submitEquation()};start();
})();
</script></body></html>
