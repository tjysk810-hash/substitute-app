<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>② 座標の宝さがし</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='9' fill='%231d6d62'/%3E%3Ctext x='20' y='29' text-anchor='middle' font-size='28' fill='white'%3E＋%3C/text%3E%3C/svg%3E"><style>
*{box-sizing:border-box}body{margin:0;background:#edf2f6;color:#1b3043;font:16px/1.7 -apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}main{max-width:900px;margin:auto;padding:24px 20px 48px}header{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:20px}h1{font-size:24px;margin:0}small,.small{font-size:14px;color:#4c6272}button,select,input{font:inherit}button,select{min-height:46px;border:1px solid #b8c8cf;border-radius:10px;background:#fff;color:#1b3043;padding:10px 14px}button{cursor:pointer;font-weight:600}button:disabled{opacity:.5;cursor:default}button:hover:not(:disabled){background:#e3f3ef}button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #007fbb;outline-offset:3px}.primary{background:#126f61;color:white;border-color:#126f61}.primary:hover:not(:disabled){background:#08594d}.settings{display:grid;grid-template-columns:1fr 1fr;gap:12px}.settings label{display:flex;flex-direction:column;font-size:14px;gap:4px}.settings select{width:100%;min-width:0}.settings button{grid-column:1/-1}.settings-note{margin:10px 0 20px}.lesson{background:white;border:1px solid #d5dfe5;border-radius:20px;overflow:hidden}.top{background:#1b3043;color:white;padding:20px 24px}.top .small{color:#cddfe8}.top h2{font-size:24px;margin:8px 0;line-height:1.6}.top p{margin:4px 0}.coordinate{font-size:34px;white-space:nowrap;font-variant-numeric:tabular-nums}.xnum{color:#9eead9}.ynum{color:#ffd493}.area{padding:20px 24px}.stages{display:flex;gap:10px;padding:0;list-style:none;margin:0 0 18px;font-size:14px}.stages li{flex:1;border-top:4px solid #dbe5e9;padding-top:7px}.stages .active{border-color:#126f61;color:#126f61;font-weight:700}.help{display:flex;align-items:center;gap:8px;font-size:14px}.help input{width:20px;height:20px}.instruction{margin:12px 0;font-size:18px;font-weight:600}.board{max-width:490px;margin:0 auto;background:#e9dbc2;border:1px solid #c3b696;border-radius:12px;overflow:hidden}.board.plain{background:#fff;border-color:#bbcbd4}.board svg{display:block;width:100%;height:auto;touch-action:manipulation}.gridline{stroke:#9e916f;stroke-opacity:.38;stroke-width:1}.plain .gridline{stroke:#c2d1db;stroke-opacity:1}.axis{stroke:#354f5a;stroke-width:2}.point{fill:#75684c}.plain .point{fill:#6e8390}.hit{fill:transparent;cursor:pointer}.hit:focus{outline:none;stroke:#007fbb;stroke-width:3;fill:#007fbb22}.inactive .hit{cursor:default}.inactive .point{opacity:.4}.tick{font-size:15px;fill:#273f4b}.axislabel{font-size:19px;font-weight:700;fill:#273f4b}.pathx{stroke:#087565;stroke-width:5;fill:none}.pathy{stroke:#a25809;stroke-width:5;fill:none}.selection{fill:#fff;stroke:#076e61;stroke-width:3}.horizontal{fill:#087565}.vertical{fill:#a25809}.legend{display:flex;justify-content:center;gap:20px;font-size:14px;margin:8px 0}.legend span:first-child{color:#086b5c}.legend span:last-child{color:#95500a}.feedback{padding:14px 16px;border-radius:10px;background:#eff4f7;margin-top:14px;min-height:56px}.feedback.good{background:#dff5ed;color:#095647}.feedback.retry{background:#fff0d9;color:#754611}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.actions button{flex:1 1 170px}.picker{margin-top:14px}.picker-controls{display:flex;flex-wrap:wrap;gap:10px;align-items:end}.picker-controls label{display:flex;flex-direction:column;flex:1}.picker-controls select{min-width:70px}details{margin-top:20px}summary{cursor:pointer;min-height:40px;font-size:14px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;border-bottom:1px solid #d5dfe5;padding:9px 5px}.bridge{padding:12px 16px;background:#e4f4ef;border-radius:10px;margin-bottom:16px}.end{padding:22px;background:#e4f4ef;border-radius:12px}.end h2{margin-top:0}[hidden]{display:none!important}@media(max-width:520px){main{padding:16px 10px 36px}header{align-items:start}h1{font-size:21px}.area{padding:16px 12px}.top{padding:18px}.settings{grid-template-columns:1fr}.top h2{font-size:21px}.stages{font-size:13px;gap:6px}.coordinate{font-size:30px}}
</style></head><body><main>
<header><h1>座標の宝さがし <small>②</small></h1><span class="small">点を選んで、<br>地面を掘ってみよう。</span></header>
<div class="settings"><label>始めるところ<select id="stage"><option value="0">１ · 横と縦で宝さがし</option><option value="1">２ · 座標で宝さがし</option><option value="2">３ · 普通の座標の問題</option></select></label><label>座標の種類<select id="range"><option value="positive">右・上だけ</option><option value="zero">０・軸の上も</option><option value="negative">負の数も</option></select></label><label>盤面の広さ<select id="size"><option value="5">入門 · ５点×５点</option><option value="7">広め · ７点×７点</option></select></label><button class="primary" id="apply">この条件で５問を始める</button></div>
<p class="small settings-note" id="setting-status" aria-live="polite"></p>
<section class="lesson"><div class="top"><div class="small" id="counter"></div><h2 id="question"></h2><p id="subquestion"></p></div><div class="area" id="area"></div></section>
<details><summary>教える人へ · この練習の記録</summary><p class="small">間違えた回数です。段階を進めても記録は残ります。上の「始める」ボタンでリセットします。画面を閉じると消えます。</p><div id="stats"></div><p class="small">点は格子線の交点です。毎問、原点から出発します。５問終わると、最後と同じ座標から次の段階を始められます。数字で選ぶ操作も、盤面と同じ答え合わせになります。</p></details>
<p class="small">宝箱は、正しい点を掘るまで見えません。正解しても勝手に進みません。</p>
</main><script>
(()=>{'use strict';
const $=id=>document.getElementById(id),num=n=>String(n).replace('-','−'),pair=p=>`(${num(p.x)}, ${num(p.y)})`;
const titles=['横と縦で宝さがし','座標で宝さがし','普通の座標の問題'],ranges={positive:'右・上だけ',zero:'０・軸の上も',negative:'負の数も'};
let stage=0,range='positive',size=5,questions=[],index=0,selected=null,column=null,solved=false,assisted=true,bridge=false,feedbackText='',feedbackClass='',mistakes=[0,0,0];
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function domain(){const min=range==='negative'?-(size-1)/2:0;return Array.from({length:size},(_,i)=>min+i)}
function makeQuestions(first=null){const all=[],d=domain(),max=d.at(-1);for(const x of d)for(const y of d)if(range!=='positive'||(x>0&&y>0))all.push({x,y});let q;if(range==='positive'){const edge={x:max,y:1+Math.floor(Math.random()*max)};q=shuffle([edge,...shuffle(all.filter(p=>pair(p)!==pair(edge))).slice(0,4)])}else if(range==='zero')q=shuffle([{x:0,y:0},{x:0,y:max},{x:max,y:0},{x:2,y:max},{x:max,y:1}]);else q=shuffle([{x:-max,y:1},{x:1,y:-max},{x:-1,y:-1},{x:0,y:max},{x:max,y:0}]);if(first)q=[first,...q.filter(p=>pair(p)!==pair(first))].slice(0,5);while(q.length<5){const p=shuffle(all).find(p=>!q.some(v=>pair(v)===pair(p)));q.push(p)}return q}
const guided=()=>stage===0||assisted;
function status(){const pending=Number($('stage').value)!==stage||$('range').value!==range||Number($('size').value)!==size;$('setting-status').textContent=(pending?'変更はまだ反映されていません。上のボタンを押してください。 ':'')+`現在：${titles[stage]} ／ ${ranges[range]} ／ ${size}点×${size}点（目盛り ${num(domain()[0])}〜${num(domain().at(-1))}）。始めると問題と記録がリセットされます。`}
function stats(){$('stats').innerHTML='<table><thead><tr><th>場面</th><th>間違い</th></tr></thead><tbody>'+['横の位置を選ぶ','横→縦で選んで答える','補助なしで点を選んで答える'].map((t,i)=>`<tr><td>${t}</td><td>${mistakes[i]}回</td></tr>`).join('')+'</tbody></table>'}
function direction(p){const h=p.x===0?'横には動かない':`${p.x>0?'右':'左'}に ${Math.abs(p.x)}`,v=p.y===0?'縦には動かない':`${p.y>0?'上':'下'}に ${Math.abs(p.y)}`;return h+'、'+v}
function resetQuestion(){selected=null;column=null;solved=false;feedbackText='';feedbackClass='';render()}
function render(){const q=questions[index];stats();$('counter').textContent=`② · 段階${stage+1} · ${index+1} / 5 問目`;$('question').innerHTML=stage===0?`原点から、${direction(q)}。`:stage===1?`宝の場所は <span class="coordinate">(<span class="xnum">${num(q.x)}</span>, <span class="ynum">${num(q.y)}</span>)</span>`:`点 <span class="coordinate">(<span class="xnum">${num(q.x)}</span>, <span class="ynum">${num(q.y)}</span>)</span> を打ちなさい。`;$('subquestion').textContent=stage===0?'地面の点を選んで、宝を見つけよう。':stage===1?'左の数字が横（x）、右の数字が縦（y）。':'左の数字がx座標、右の数字がy座標。';
$('area').innerHTML=`<ol class="stages">${titles.map((t,i)=>`<li class="${i===stage?'active':''}" ${i===stage?'aria-current="step"':''}>${i+1} ${t}</li>`).join('')}</ol>${bridge&&index===0?'<div class="bridge">さっきと同じ '+pair(q)+' の場所。'+(stage===2?'今度は宝を掘る代わりに、点を打ってみよう。':'今度は「横・縦」のヒントを、座標の書き方で読んでみよう。')+'</div>':''}<label class="help"><input id="assist" type="checkbox" ${guided()?'checked':''} ${stage===0?'disabled':''}>横→縦の順に選ぶ補助${stage===0?'（この段階ではON）':''}</label><p id="instruction" class="instruction"></p><div id="board" class="board ${stage===2?'plain':''}"></div><div class="legend"><span>横：x（緑の線）</span><span>縦：y（茶色の線）</span></div><div id="feedback" class="feedback" role="status" aria-live="polite"></div><div class="actions"><button id="back">１つ前の操作に戻る</button><button id="dig" class="primary">${stage===2?'ここに点を打つ':'ここを掘る'}</button><button id="next" class="primary" hidden>${index===4?'５問を振り返る':'次の問題へ'}</button></div><details class="picker" ${size===7?'open':''}><summary>点を数字で選ぶ（押しにくいときはこちら）</summary><div class="picker-controls"><label>横（x）<select id="pick-x">${domain().map(v=>`<option value="${v}">${num(v)}</option>`).join('')}</select></label><label>縦（y）<select id="pick-y">${domain().map(v=>`<option value="${v}">${num(v)}</option>`).join('')}</select></label><button id="pick">この点を選ぶ</button></div></details>`;
$('assist').onchange=()=>{assisted=$('assist').checked;resetQuestion()};$('back').onclick=back;$('dig').onclick=submit;$('next').onclick=()=>{if(!solved)return;if(index===4){finish();return}index++;resetQuestion()};$('pick').onclick=()=>selectPoint(Number($('pick-x').value),Number($('pick-y').value));draw();update()}
function draw(){const vals=domain(),min=vals[0],max=vals.at(-1),spacing=256/(size-1),hitRadius=Math.min(23,spacing/2-1),X=x=>46+(x-min)*spacing,Y=y=>302-(y-min)*spacing,ox=X(0),oy=Y(0);let svg=`<svg viewBox="0 0 360 350" role="group" aria-label="座標の点を選ぶ。横がx、縦がy。原点から出発。">`;
for(const v of vals)svg+=`<line class="gridline" x1="${X(v)}" x2="${X(v)}" y1="${Y(max)}" y2="${Y(min)}"/><line class="gridline" x1="${X(min)}" x2="${X(max)}" y1="${Y(v)}" y2="${Y(v)}"/>`;
svg+=`<line class="axis" x1="30" x2="325" y1="${oy}" y2="${oy}"/><line class="axis" x1="${ox}" x2="${ox}" y1="26" y2="320"/><text class="axislabel" x="332" y="${oy+6}">x</text><text class="axislabel" x="${ox-5}" y="20">y</text>`;
for(const v of vals){svg+=`<text class="tick" x="${X(v)}" y="${oy+23}" text-anchor="middle">${num(v)}</text>`;if(v!==0)svg+=`<text class="tick" x="${ox-14}" y="${Y(v)+5}" text-anchor="end">${num(v)}</text>`}
if(column!==null)svg+=`<path class="pathx" d="M ${ox} ${oy} H ${X(column)}"/>`;
if(selected){svg+=`<path class="pathx" d="M ${ox} ${oy} H ${X(selected.x)}"/><path class="pathy" d="M ${X(selected.x)} ${oy} V ${Y(selected.y)}"/>`}
for(const x of vals)for(const y of vals){const enabled=!solved&&(!guided()||(column===null?y===0:x===column));svg+=`<g class="${enabled?'':'inactive'}"><circle class="point" cx="${X(x)}" cy="${Y(y)}" r="3.5"/><circle class="hit" cx="${X(x)}" cy="${Y(y)}" r="${hitRadius}" role="button" tabindex="${enabled?'0':'-1'}" aria-disabled="${!enabled}" aria-label="横 ${num(x)}、縦 ${num(y)} の点" data-x="${x}" data-y="${y}"/></g>`}
if(selected)svg+=`<circle class="selection" cx="${X(selected.x)}" cy="${Y(selected.y)}" r="10" pointer-events="none"/>`;
svg+=`<text class="tick" x="12" y="339">原点：横0・縦0</text>`;
if(solved){const q=questions[index];svg+=stage===2?`<circle cx="${X(q.x)}" cy="${Y(q.y)}" r="7" fill="#087565" pointer-events="none"/>`:`<text x="${X(q.x)}" y="${Y(q.y)-9}" font-size="30" text-anchor="middle" pointer-events="none" aria-label="宝箱">🎁</text>`}svg+='</svg>';$('board').innerHTML=svg;document.querySelectorAll('[data-x]').forEach(el=>{const action=()=>{if(el.getAttribute('aria-disabled')==='false')selectPoint(Number(el.dataset.x),Number(el.dataset.y))};el.onclick=action;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();action()}}})}
function update(){const choosingX=guided()&&column===null;const q=questions[index];$('instruction').textContent=solved?(stage===2?'点を打てた！':'宝を見つけた！'):choosingX?`① 原点から、横の ${num(q.x)} を選ぼう。`:guided()?`② 横 ${num(column)} から、縦の ${num(q.y)} の点を選ぼう。`:'原点から横・縦を読んで、点を１つ選ぼう。';$('feedback').textContent=feedbackText||(selected?`選んだ場所は ${pair(selected)}。${direction(selected)}。`:choosingX?'まずはx軸の上の点を選ぼう。０なら原点を選ぶ。':guided()?'縦は０から数える。０ならx軸の上の点を選ぶ。':'点を選んでから、答えを確かめよう。');$('feedback').className='feedback '+feedbackClass;$('dig').disabled=!selected||solved;$('dig').hidden=solved;$('next').hidden=!solved;$('back').disabled=!selected&&column===null&&!solved;$('assist').disabled=stage===0||solved;$('pick').disabled=solved;$('pick-x').disabled=solved||(guided()&&column!==null);$('pick-y').disabled=solved||choosingX;if(choosingX)$('pick-y').value='0';if(column!==null)$('pick-x').value=String(column);else if(selected)$('pick-x').value=String(selected.x);if(selected)$('pick-y').value=String(selected.y)}
function selectPoint(x,y){if(solved||!domain().includes(x)||!domain().includes(y))return;feedbackText='';feedbackClass='';const q=questions[index];if(guided()&&column===null){if(y!==0)return;if(x!==q.x){mistakes[0]++;feedbackText=`今選んだ横の位置は ${num(x)}。ヒントは横 ${num(q.x)}。原点から数え直そう。`;feedbackClass='retry';stats();update();return}column=x;selected=null;feedbackText=`横 ${num(x)} の位置まで来たね。次は縦。`;}else{if(guided()&&x!==column)return;selected={x,y}}draw();update()}
function submit(){if(!selected||solved)return;const q=questions[index];if(selected.x===q.x&&selected.y===q.y){solved=true;feedbackClass='good';feedbackText=`正解！ ${pair(q)} は、横 ${num(q.x)}、縦 ${num(q.y)}。${stage===2?'この点が答え。':'この点の地面に宝が埋まっていたよ。'}`;}else{mistakes[guided()?1:2]++;feedbackClass='retry';feedbackText=`ここは ${pair(selected)}（横 ${num(selected.x)}・縦 ${num(selected.y)}）。目指すのは ${pair(q)}（横 ${num(q.x)}・縦 ${num(q.y)}）。もう一度選んでみよう。`}stats();draw();update();if(solved)$('next').focus()}
function back(){if(solved){solved=false;selected=null}else if(selected)selected=null;else column=null;feedbackText='';feedbackClass='';draw();update()}
function finish(){const q=questions[index];$('area').innerHTML=`<div class="end"><h2>５つの場所を見つけられた。</h2><p>座標は <strong>（横の位置, 縦の位置）</strong>。<br>毎回、原点から出発する。</p>${stage<2?`<p>次は、最後の ${pair(q)} と同じ場所を、${stage===0?'座標のヒントで探そう。':'普通の問題として答えてみよう。'}</p>`:'<p>宝を掘った点も、問題の答えの点も、同じ座標の読み方。</p>'}</div><div class="actions">${stage<2?`<button id="next-stage" class="primary">${stage===0?'座標で宝さがしへ':'普通の座標の問題へ'}</button>`:''}<button id="again">この段階でもう５問</button></div>`;if(stage<2)$('next-stage').onclick=()=>{stage++;$('stage').value=String(stage);questions=makeQuestions(q);index=0;bridge=true;resetQuestion();status()};$('again').onclick=()=>{questions=makeQuestions();index=0;bridge=false;resetQuestion()}}
function start(){stage=Number($('stage').value);range=$('range').value;size=Number($('size').value)||5;questions=makeQuestions();index=0;bridge=false;assisted=stage===0;mistakes=[0,0,0];resetQuestion();status()}
$('stage').onchange=status;$('range').onchange=status;$('size').onchange=status;$('apply').onclick=()=>{start();$('counter').scrollIntoView({block:'start',behavior:'instant'})};start();
})();
</script></body></html>
